<!DOCTYPE html>
<html>
<head>
    <title>Gallery Frontend Diagnostic</title>
    <style>
        body {
            font-family: monospace;
            margin: 20px;
            background: #f5f5f5;
        }
        .result {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .success { border-color: #4caf50; background: #f1f8e9; }
        .error { border-color: #f44336; background: #ffebee; }
        .loading { border-color: #2196f3; background: #e3f2fd; }
        pre {
            background: #f5f5f5;
            padding: 10px;
            overflow: auto;
            border-radius: 4px;
        }
        button {
            background: #2196f3;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Gallery Frontend Diagnostic</h1>
    
    <div>
        <button onclick="testAPI()">Test Gallery API</button>
        <button onclick="testAuth()">Test Authentication</button>
        <button onclick="testStorageStats()">Test Storage Stats</button>
        <button onclick="clearResults()">Clear Results</button>
    </div>
    
    <div id="results"></div>
    
    <script>
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            
            if (typeof message === 'object') {
                div.innerHTML = '<pre>' + JSON.stringify(message, null, 2) + '</pre>';
            } else {
                div.textContent = message;
            }
            
            results.appendChild(div);
            console.log(message);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testAuth() {
            log('Testing authentication...', 'loading');
            
            try {
                const response = await fetch('/api/user/profile', {
                    credentials: 'include'
                });
                
                log(`Auth response status: ${response.status} ${response.statusText}`);
                
                if (!response.ok) {
                    log(`Authentication failed: ${response.status}`, 'error');
                    return false;
                }
                
                const data = await response.json();
                log('Authentication successful:', 'success');
                log(data, 'success');
                return true;
                
            } catch (error) {
                log(`Auth error: ${error.message}`, 'error');
                return false;
            }
        }
        
        async function testStorageStats() {
            log('Testing storage stats API...', 'loading');
            
            try {
                const response = await fetch('/api/gallery/user/storage-stats', {
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                log(`Storage stats response: ${response.status} ${response.statusText}`);
                
                if (response.status === 401) {
                    log('Authentication required for storage stats', 'error');
                    return;
                }
                
                const data = await response.json();
                
                if (data.success) {
                    log('Storage stats retrieved successfully:', 'success');
                    log(data.stats, 'success');
                } else {
                    log(`Storage stats error: ${data.error}`, 'error');
                }
                
            } catch (error) {
                log(`Storage stats fetch error: ${error.message}`, 'error');
            }
        }
        
        async function testAPI() {
            log('Testing gallery API...', 'loading');
            
            // First test authentication
            const isAuth = await testAuth();
            if (!isAuth) {
                log('Cannot test gallery API without authentication', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/gallery/user/images', {
                    credentials: 'include',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                log(`Gallery API response: ${response.status} ${response.statusText}`);
                log(`Response headers:`, 'info');
                
                const headers = {};
                response.headers.forEach((value, name) => {
                    headers[name] = value;
                });
                log(headers, 'info');
                
                if (response.status === 401) {
                    log('Authentication required for gallery API', 'error');
                    return;
                }
                
                if (!response.ok) {
                    const text = await response.text();
                    log(`API error response: ${text}`, 'error');
                    return;
                }
                
                const data = await response.json();
                
                if (data.success) {
                    log(`Gallery API successful! Found ${(data.images || []).length} images:`, 'success');
                    
                    if (data.images && data.images.length > 0) {
                        log('Images found:', 'success');
                        data.images.forEach((img, index) => {
                            log(`${index + 1}. ${img.title || 'Untitled'}`, 'success');
                            log(`   URL: ${img.url}`, 'info');
                            log(`   Path: ${img.relativePath}`, 'info');
                            log(`   Size: ${img.sizeFormatted || 'Unknown'}`, 'info');
                        });
                        
                        // Test first image URL
                        if (data.images[0]) {
                            log('Testing first image URL...', 'loading');
                            testImageURL(data.images[0].url);
                        }
                    } else {
                        log('No images in gallery', 'info');
                    }
                } else {
                    log(`Gallery API error: ${data.error}`, 'error');
                }
                
            } catch (error) {
                log(`Gallery API fetch error: ${error.message}`, 'error');
            }
        }
        
        async function testImageURL(url) {
            try {
                const response = await fetch(url, {
                    method: 'HEAD',
                    credentials: 'include'
                });
                
                if (response.ok) {
                    log(`✓ Image URL accessible: ${response.status}`, 'success');
                    log(`Content-Type: ${response.headers.get('Content-Type')}`, 'info');
                    log(`Content-Length: ${response.headers.get('Content-Length')}`, 'info');
                } else {
                    log(`✗ Image URL failed: ${response.status} ${response.statusText}`, 'error');
                }
                
            } catch (error) {
                log(`✗ Image URL test error: ${error.message}`, 'error');
            }
        }
        
        // Auto-run tests on page load
        window.onload = function() {
            log('Gallery Frontend Diagnostic Tool loaded');
            log('Click "Test Gallery API" to run comprehensive tests');
        };
    </script>
</body>
</html>
