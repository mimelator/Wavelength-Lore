<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a2e" rx="8"/>
  
  <!-- Game Board -->
  <g transform="translate(40, 30)">
    <!-- Board Container -->
    <rect x="0" y="0" width="320" height="200" fill="#2b2b42" rx="12" stroke="#667eea" stroke-width="2"/>
    
    <!-- Game Title -->
    <text x="160" y="25" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="16" font-weight="bold">🎮 Wavelength Gems</text>
    
    <!-- Match-3 Grid -->
    <g transform="translate(60, 50)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="40" height="40" fill="#667eea" rx="6" stroke="#764ba2" stroke-width="2"/>
      <rect x="50" y="0" width="40" height="40" fill="#764ba2" rx="6" stroke="#667eea" stroke-width="2"/>
      <rect x="100" y="0" width="40" height="40" fill="#667eea" rx="6" stroke="#764ba2" stroke-width="2"/>
      <rect x="150" y="0" width="40" height="40" fill="#f5576c" rx="6" stroke="#f093fb" stroke-width="2"/>
      
      <!-- Row 2 -->
      <rect x="0" y="50" width="40" height="40" fill="#764ba2" rx="6" stroke="#667eea" stroke-width="2"/>
      <rect x="50" y="50" width="40" height="40" fill="#f5576c" rx="6" stroke="#f093fb" stroke-width="2"/>
      <rect x="100" y="50" width="40" height="40" fill="#667eea" rx="6" stroke="#764ba2" stroke-width="2"/>
      <rect x="150" y="50" width="40" height="40" fill="#764ba2" rx="6" stroke="#667eea" stroke-width="2"/>
      
      <!-- Row 3 -->
      <rect x="0" y="100" width="40" height="40" fill="#f5576c" rx="6" stroke="#f093fb" stroke-width="2"/>
      <rect x="50" y="100" width="40" height="40" fill="#667eea" rx="6" stroke="#764ba2" stroke-width="2"/>
      <rect x="100" y="100" width="40" height="40" fill="#764ba2" rx="6" stroke="#667eea" stroke-width="2"/>
      <rect x="150" y="100" width="40" height="40" fill="#667eea" rx="6" stroke="#764ba2" stroke-width="2"/>
    </g>
    
    <!-- Badge/Reward Indicator -->
    <g transform="translate(60, 165)">
      <rect x="0" y="0" width="80" height="25" fill="#f093fb" rx="12"/>
      <text x="40" y="17" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🏆 Badge</text>
      
      <rect x="90" y="0" width="80" height="25" fill="#f5576c" rx="12"/>
      <text x="130" y="17" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">⭐ Reward</text>
      
      <rect x="180" y="0" width="80" height="25" fill="#667eea" rx="12"/>
      <text x="220" y="17" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">📚 Episode</text>
    </g>
  </g>
  
  <!-- Label -->
  <text x="200" y="275" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="10">Match-3 puzzle game with lore-themed levels</text>
</svg>
