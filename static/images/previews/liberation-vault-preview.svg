<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a2e" rx="8"/>
  
  <!-- Liberation Vault Header -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="340" height="50" fill="url(#vaultGradient)" rx="8"/>
    <text x="170" y="32" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="bold">🏛️ The Liberation Vault</text>
  </g>
  
  <!-- Gallery Selection Area -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="100" height="70" fill="#2b2b42" rx="6" stroke="#667eea" stroke-width="2"/>
    <rect x="10" y="10" width="80" height="40" fill="#764ba2" opacity="0.6" rx="4"/>
    <text x="50" y="35" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="20">🖼️</text>
    <text x="50" y="60" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="9">Gallery Image</text>
  </g>
  
  <!-- Product Types -->
  <g transform="translate(150, 80)">
    <!-- T-Shirt -->
    <rect x="0" y="0" width="70" height="70" fill="#2b2b42" rx="6" stroke="#f5576c" stroke-width="2"/>
    <text x="35" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30">👕</text>
    <text x="35" y="60" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="9">T-Shirt</text>
    
    <!-- Tote Bag -->
    <rect x="80" y="0" width="70" height="70" fill="#2b2b42" rx="6" stroke="#f5576c" stroke-width="2"/>
    <text x="115" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30">👜</text>
    <text x="115" y="60" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="9">Tote Bag</text>
    
    <!-- Mug -->
    <rect x="160" y="0" width="70" height="70" fill="#2b2b42" rx="6" stroke="#f5576c" stroke-width="2"/>
    <text x="195" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="30">☕</text>
    <text x="195" y="60" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="9">Mug</text>
  </g>
  
  <!-- Customization Preview -->
  <g transform="translate(30, 165)">
    <rect x="0" y="0" width="340" height="80" fill="#1a1a2e" rx="6" stroke="#f093fb" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="20" y="20" fill="#f093fb" font-family="Arial, sans-serif" font-size="12" font-weight="bold">🎨 Customization Options</text>
    <text x="20" y="38" fill="#b0b0b0" font-family="Arial, sans-serif" font-size="10">• Color Effects (Vibrancy, Sepia, Coolness)</text>
    <text x="20" y="52" fill="#b0b0b0" font-family="Arial, sans-serif" font-size="10">• Atmospheric Effects (Lightning, Snow, Fireflies)</text>
    <text x="20" y="66" fill="#b0b0b0" font-family="Arial, sans-serif" font-size="10">• Borders &amp; Frames</text>
  </g>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="vaultGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Label -->
  <text x="200" y="275" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="10">Create custom merchandise from your collected gallery images</text>
</svg>
