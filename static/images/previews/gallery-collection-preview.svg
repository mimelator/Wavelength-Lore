<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#1a1a2e" rx="8"/>
  
  <!-- Episode Image Grid -->
  <g transform="translate(30, 30)">
    <!-- Episode Card 1 -->
    <rect x="0" y="0" width="160" height="110" fill="#2b2b42" rx="8" stroke="#667eea" stroke-width="2"/>
    <rect x="10" y="10" width="140" height="70" fill="#764ba2" opacity="0.6" rx="4"/>
    <text x="80" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24">🖼️</text>
    <text x="80" y="95" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Episode Image</text>
    
    <!-- Collect Button -->
    <rect x="45" y="100" width="70" height="25" fill="#f5576c" rx="12"/>
    <text x="80" y="116" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">➕ Collect</text>
    
    <!-- Episode Card 2 -->
    <rect x="180" y="0" width="160" height="110" fill="#2b2b42" rx="8" stroke="#764ba2" stroke-width="2"/>
    <rect x="190" y="10" width="140" height="70" fill="#667eea" opacity="0.6" rx="4"/>
    <text x="260" y="50" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24">🖼️</text>
    <text x="260" y="95" text-anchor="middle" fill="#e0e0e0" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Episode Image</text>
    
    <!-- Collect Button -->
    <rect x="225" y="100" width="70" height="25" fill="#f5576c" rx="12"/>
    <text x="260" y="116" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">➕ Collect</text>
    
    <!-- Gallery Indicator -->
    <rect x="0" y="130" width="340" height="50" fill="#1a1a2e" rx="8" stroke="#f093fb" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="20" y="150" fill="#f093fb" font-family="Arial, sans-serif" font-size="12" font-weight="bold">📚 Your Gallery</text>
    <text x="20" y="168" fill="#b0b0b0" font-family="Arial, sans-serif" font-size="10">Collected images appear here</text>
    <circle cx="310" cy="155" r="8" fill="#f5576c"/>
    <text x="310" y="160" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="10" font-weight="bold">2</text>
  </g>
  
  <!-- Label -->
  <text x="200" y="275" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="10">Collect images from episodes to use in The Liberation Vault</text>
</svg>
