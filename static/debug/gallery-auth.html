<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Authentication Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .card {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .info-row {
            display: flex;
            margin-bottom: 8px;
        }
        .label {
            width: 200px;
            font-weight: bold;
        }
        .value {
            flex: 1;
        }
        .success {
            color: #27ae60;
            font-weight: bold;
        }
        .warning {
            color: #e67e22;
            font-weight: bold;
        }
        .error {
            color: #e74c3c;
            font-weight: bold;
        }
        .button {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            margin-top: 10px;
        }
        .button:hover {
            background: #2980b9;
        }
        pre {
            background: #f1f1f1;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Gallery Authentication Diagnostic</h1>
    
    <div class="card">
        <h2>Authentication Status</h2>
        <div id="auth-status">Loading authentication status...</div>
    </div>
    
    <div class="card">
        <h2>User Information</h2>
        <div id="user-info">Loading user information...</div>
    </div>
    
    <div class="card">
        <h2>Gallery Diagnostics</h2>
        <div id="gallery-info">Loading gallery information...</div>
    </div>
    
    <div class="card">
        <h2>Actions</h2>
        <p>
            <a href="/login" class="button">Log In / Switch Account</a>
            <a href="/my-gallery" class="button">Go to Gallery</a>
            <a href="/debug/gallery-auth" class="button">View Raw JSON Data</a>
        </p>
    </div>

    <script>
        // Fetch authentication data
        fetch('/debug/gallery-auth')
            .then(response => {
                if (response.status === 401) {
                    // Not authenticated
                    document.getElementById('auth-status').innerHTML = `
                        <p class="error">Not authenticated. Please <a href="/login?redirect=/debug/gallery-auth.html">log in</a> to continue.</p>
                    `;
                    document.getElementById('user-info').innerHTML = `<p>Not available - please log in first</p>`;
                    document.getElementById('gallery-info').innerHTML = `<p>Not available - please log in first</p>`;
                    return Promise.reject('Not authenticated');
                }
                return response.json();
            })
            .then(data => {
                // Show authentication status
                const authMethod = data.authInfo.authMethod;
                document.getElementById('auth-status').innerHTML = `
                    <div class="info-row">
                        <span class="label">Status:</span>
                        <span class="value success">Authenticated</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Auth Method:</span>
                        <span class="value">${authMethod}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Environment:</span>
                        <span class="value">${data.userInfo.environment}</span>
                    </div>
                `;
                
                // Show user info
                document.getElementById('user-info').innerHTML = `
                    <div class="info-row">
                        <span class="label">User ID:</span>
                        <span class="value">${data.userInfo.uid}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Name:</span>
                        <span class="value">${data.userInfo.name || 'Not provided'}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Email:</span>
                        <span class="value">${data.userInfo.email || 'Not provided'}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Email Verified:</span>
                        <span class="value">${data.userInfo.emailVerified ? 'Yes' : 'No'}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Groups:</span>
                        <span class="value">${data.userInfo.groups.length > 0 ? data.userInfo.groups.join(', ') : 'None'}</span>
                    </div>
                `;
                
                // Show gallery info
                document.getElementById('gallery-info').innerHTML = `
                    <div class="info-row">
                        <span class="label">Expected Upload Path:</span>
                        <span class="value">${data.galleryDiagnostics.expectedUploadPath}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">S3 Bucket:</span>
                        <span class="value">${data.galleryDiagnostics.s3Bucket}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">CDN URL:</span>
                        <span class="value">${data.galleryDiagnostics.cdnUrl}</span>
                    </div>
                `;
            })
            .catch(error => {
                if (error !== 'Not authenticated') {
                    console.error('Error fetching auth data:', error);
                    document.getElementById('auth-status').innerHTML = `
                        <p class="error">Error fetching authentication data: ${error}</p>
                    `;
                }
            });
    </script>
</body>
</html>
