<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking - Wavelength Lore</title>
    <link rel="stylesheet" href="/static/css/base-styles.css">
    <link rel="stylesheet" href="/static/css/enhanced-product-ui.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <style>
        .tracking-container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 2rem;
        }

        .tracking-header {
            text-align: center;
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tracking-header h1 {
            color: #fff;
            font-size: 2rem;
            margin-bottom: 1rem;
            font-family: 'AnimeAce', Arial, sans-serif;
        }

        .order-search {
            display: flex;
            gap: 1rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .search-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-family: 'AnimeAce', Arial, sans-serif;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .tracking-results {
            display: none;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 2rem;
        }

        .order-status {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-icon {
            font-size: 2rem;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            border-radius: 50%;
            color: white;
            flex-shrink: 0;
        }

        .status-details h3 {
            color: #fff;
            margin: 0 0 0.5rem 0;
            font-size: 1.3rem;
        }

        .status-description {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 0.5rem;
        }

        .tracking-number {
            color: #4CAF50;
            font-weight: 600;
            font-family: 'Courier New', monospace;
        }

        .estimated-delivery {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        .tracking-timeline {
            margin-top: 2rem;
        }

        .timeline-header {
            color: #fff;
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .timeline {
            position: relative;
            padding-left: 2rem;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 0.75rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background: rgba(255, 255, 255, 0.2);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 2rem;
            padding-left: 2rem;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            left: -0.5rem;
            top: 0.5rem;
            width: 1rem;
            height: 1rem;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
        }

        .timeline-item.completed::before {
            background: #4CAF50;
            border-color: #4CAF50;
        }

        .timeline-item.current::before {
            background: #667eea;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        .timeline-status {
            color: #fff;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .timeline-date {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .timeline-description {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: #f44336;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1rem;
            text-align: center;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .tracking-container {
                margin: 1rem;
                padding: 1rem;
            }

            .order-search {
                flex-direction: column;
            }

            .timeline {
                padding-left: 1.5rem;
            }

            .timeline-item {
                padding-left: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="tracking-container">
        <div class="tracking-header">
            <h1>📦 Order Tracking</h1>
            <p style="color: rgba(255, 255, 255, 0.7); margin-bottom: 2rem;">
                Enter your order number to track your shipment
            </p>
            
            <div class="order-search">
                <input type="text" 
                       class="search-input" 
                       id="order-input" 
                       placeholder="Enter order number (e.g., pi_1234567890)"
                       maxlength="50">
                <button class="search-btn" id="track-btn">
                    <span id="track-btn-text">Track Order</span>
                </button>
            </div>
        </div>

        <div class="tracking-results" id="tracking-results">
            <!-- Results will be populated by JavaScript -->
        </div>

        <div class="error-message" id="error-message" style="display: none;">
            <!-- Error messages will be shown here -->
        </div>
    </div>

    <script>
        /**
         * WAVELENGTH Order Tracking System
         * ===============================
         * 
         * Provides real-time order tracking and status updates
         */
        class OrderTracker {
            constructor() {
                this.init();
            }

            init() {
                this.setupEventListeners();
                
                // Check for order ID in URL
                const urlParams = new URLSearchParams(window.location.search);
                const orderId = urlParams.get('order');
                if (orderId) {
                    document.getElementById('order-input').value = orderId;
                    this.trackOrder(orderId);
                }
            }

            setupEventListeners() {
                const trackBtn = document.getElementById('track-btn');
                const orderInput = document.getElementById('order-input');

                trackBtn.addEventListener('click', () => {
                    const orderId = orderInput.value.trim();
                    if (orderId) {
                        this.trackOrder(orderId);
                    }
                });

                orderInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        const orderId = orderInput.value.trim();
                        if (orderId) {
                            this.trackOrder(orderId);
                        }
                    }
                });
            }

            async trackOrder(orderId) {
                try {
                    this.showLoading(true);
                    this.hideError();
                    this.hideResults();

                    console.log('🔍 Tracking order:', orderId);

                    const response = await fetch(`/api/merchandise/tracking/${orderId}`);
                    
                    if (response.ok) {
                        const result = await response.json();
                        if (result.success) {
                            this.displayTrackingInfo(result.tracking);
                        } else {
                            this.showError(result.error || 'Order not found');
                        }
                    } else {
                        // Fallback to demo tracking data
                        this.showDemoTrackingData(orderId);
                    }
                } catch (error) {
                    console.error('❌ Tracking error:', error);
                    this.showDemoTrackingData(orderId);
                } finally {
                    this.showLoading(false);
                }
            }

            displayTrackingInfo(tracking) {
                const resultsContainer = document.getElementById('tracking-results');
                
                const statusIcon = this.getStatusIcon(tracking.status);
                
                resultsContainer.innerHTML = `
                    <div class="order-status">
                        <div class="status-icon">${statusIcon}</div>
                        <div class="status-details">
                            <h3>${tracking.status}</h3>
                            <div class="status-description">${tracking.statusDescription}</div>
                            <div class="tracking-number">Tracking: ${tracking.trackingNumber}</div>
                            <div class="estimated-delivery">Estimated Delivery: ${tracking.estimatedDelivery}</div>
                        </div>
                    </div>

                    <div class="tracking-timeline">
                        <h4 class="timeline-header">📋 Order Timeline</h4>
                        <div class="timeline">
                            ${tracking.timeline.map((item, index) => this.renderTimelineItem(item, index, tracking.timeline.length)).join('')}
                        </div>
                    </div>
                `;

                this.showResults();
            }

            renderTimelineItem(item, index, total) {
                const isCompleted = item.completed;
                const isCurrent = !isCompleted && index === tracking.timeline.findIndex(t => !t.completed);
                const itemClass = isCompleted ? 'completed' : (isCurrent ? 'current' : '');
                
                const date = new Date(item.timestamp).toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                return `
                    <div class="timeline-item ${itemClass}">
                        <div class="timeline-status">${item.status}</div>
                        <div class="timeline-date">${date}</div>
                        <div class="timeline-description">${item.description}</div>
                    </div>
                `;
            }

            getStatusIcon(status) {
                const icons = {
                    'Order Confirmed': '✅',
                    'Processing': '⚙️',
                    'Shipped': '🚚',
                    'Out for Delivery': '📦',
                    'Delivered': '🎉'
                };
                return icons[status] || '📋';
            }

            showDemoTrackingData(orderId) {
                const demoTracking = {
                    orderId: orderId,
                    status: 'Processing',
                    statusDescription: 'Your order is being prepared for shipment.',
                    estimatedDelivery: new Date(Date.now() + 5 * 24 * 60 * 60 * 1000).toLocaleDateString(),
                    trackingNumber: `WL${orderId.slice(-8).toUpperCase()}`,
                    timeline: [
                        {
                            status: 'Order Confirmed',
                            timestamp: new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString(),
                            completed: true,
                            description: 'Order received and payment confirmed'
                        },
                        {
                            status: 'Processing',
                            timestamp: new Date(Date.now() - 1 * 60 * 60 * 1000).toISOString(),
                            completed: true,
                            description: 'Order is being prepared'
                        },
                        {
                            status: 'Shipped',
                            timestamp: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString(),
                            completed: false,
                            description: 'Order has been shipped'
                        },
                        {
                            status: 'Delivered',
                            timestamp: new Date(Date.now() + 5 * 24 * 60 * 60 * 1000).toISOString(),
                            completed: false,
                            description: 'Order delivered to customer'
                        }
                    ]
                };

                this.displayTrackingInfo(demoTracking);
            }

            showLoading(show) {
                const btnText = document.getElementById('track-btn-text');
                if (show) {
                    btnText.innerHTML = '<span class="loading-spinner"></span> Tracking...';
                } else {
                    btnText.textContent = 'Track Order';
                }
            }

            showError(message) {
                const errorDiv = document.getElementById('error-message');
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
            }

            hideError() {
                document.getElementById('error-message').style.display = 'none';
            }

            showResults() {
                document.getElementById('tracking-results').style.display = 'block';
            }

            hideResults() {
                document.getElementById('tracking-results').style.display = 'none';
            }
        }

        // Initialize order tracker when page loads
        window.addEventListener('DOMContentLoaded', () => {
            new OrderTracker();
        });
    </script>
</body>
</html>
