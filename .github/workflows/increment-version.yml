# 
# This version increment workflow is DISABLED and no longer needed.
# Version management is now handled manually via scripts/manual-deploy.sh
#
# LAST DISABLED: 2025-10-29

name: Auto-increment Version (DISABLED)

# DISABLED: Auto version increment workflow 
# Version management now handled in manual deployment process
on:
  workflow_dispatch:  # Manual trigger only (effectively disabled)
  # DISABLED - version increment now happens in manual deployment workflow
  # workflow_run:
  #   workflows: ["Build and Deploy to ECR"]
  #   types:
  #     - completed
  #   branches: [ main ]

permissions:
  contents: write  # Required to push commits and create tags
  actions: read    # Required to read workflow information

jobs:
  increment-version:
    runs-on: ubuntu-latest

    # DISABLED: Force disable this entire job - manual deployment handles versioning
    if: false  # Force disable - workflow will not run
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Deployment Success Check
        run: |
          echo "::notice::========================================="
          echo "::notice::Deployment workflow succeeded!"
          echo "::notice::Proceeding with version increment..."
          echo "::notice::========================================="
          echo "Workflow: ${{ github.event.workflow_run.name }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"

      - name: Get current version
        id: current_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

      - name: Increment patch version
        id: increment_version
        run: |
          # Use npm to increment the patch version
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update version.json
        run: |
          NEW_VERSION="${{ steps.increment_version.outputs.new }}"
          COMMIT_HASH="${{ github.event.workflow_run.head_sha }}"
          COMMIT_SHORT="${COMMIT_HASH:0:7}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > version.json << EOF
          {
            "version": "$NEW_VERSION",
            "buildDate": "$BUILD_DATE",
            "commitHash": "$COMMIT_HASH",
            "commitShort": "$COMMIT_SHORT",
            "buildNumber": "${{ github.run_number }}",
            "environment": "production",
            "deploymentWorkflowId": "${{ github.event.workflow_run.id }}",
            "deploymentStatus": "verified"
          }
          EOF

          echo "Created version.json:"
          cat version.json

      - name: Commit version changes
        run: |
          git add package.json version.json
          git commit -m "🔖 Auto-increment version to ${{ steps.increment_version.outputs.new }} [skip version]"

      - name: Push changes and create tag
        run: |
          # Push the commit
          git push origin main
          
          # Create and push tag
          NEW_VERSION="${{ steps.increment_version.outputs.new }}"
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: Summary
        run: |
          echo "::notice::========================================="
          echo "::notice::✅ Version Update Complete!"
          echo "::notice::========================================="
          echo "::notice::Version incremented from ${{ steps.current_version.outputs.current }} to ${{ steps.increment_version.outputs.new }}"
          echo "::notice::Git tag v${{ steps.increment_version.outputs.new }} created"
          echo "::notice::Deployed Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "::notice::Build #${{ github.run_number }}"
          echo "::notice::Deployment Status: Verified and Healthy"
          echo "::notice::========================================="