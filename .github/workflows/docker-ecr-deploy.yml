name: Build and Deploy to ECR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Build and Push Docker Image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: wavelength-lore
          COMMIT_SHA: ${{ github.sha }}
        run: |
          # Extract short commit SHA
          SHORT_SHA=${COMMIT_SHA:0:8}
          
          # Get version from package.json for the primary tag
          VERSION_TAG="v$(cat package.json | grep '"version"' | sed 's/.*"version": "\(.*\)",/\1/')"

          echo "Building with tags: $VERSION_TAG and $SHORT_SHA"

          # Build with buildx and push with multiple tags
          # Using specific version tag instead of :latest for better deployment control
          # Use GitHub Actions cache instead of registry cache (more reliable)
          docker buildx build \
            --platform linux/amd64 \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            --progress=plain \
            .

          echo "::notice::Successfully pushed images with tags: $VERSION_TAG, $SHORT_SHA"
          echo "::notice::Commit SHA: $COMMIT_SHA"
          echo "::notice::Short SHA: $SHORT_SHA"
          echo "::notice::Version Tag: $VERSION_TAG"
          echo "::notice::Image: $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG"
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to App Runner
        id: deploy-apprunner
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: wavelength-lore
          COMMIT_SHA: ${{ github.sha }}
          APPRUNNER_SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
          VERSION_TAG: ${{ steps.build.outputs.version_tag }}
        run: |
          # Extract short commit SHA
          SHORT_SHA=${COMMIT_SHA:0:8}

          echo "::notice::Deploying commit $SHORT_SHA (version $VERSION_TAG) to App Runner"

          # Check App Runner service status first - fail fast if busy
          CURRENT_STATUS=$(aws apprunner describe-service \
            --service-arn $APPRUNNER_SERVICE_ARN \
            --query 'Service.Status' \
            --output text)

          echo "Current App Runner status: $CURRENT_STATUS"

          if [ "$CURRENT_STATUS" != "RUNNING" ]; then
            echo "::error::❌ App Runner service is not in RUNNING state (current: $CURRENT_STATUS)"
            echo "::error::This usually means another deployment is in progress or the service is recovering."
            echo "::error::Please wait for the service to return to RUNNING state and retry the deployment."
            echo "::error::You can check status with: aws apprunner describe-service --service-arn $APPRUNNER_SERVICE_ARN"
            exit 1
          fi

          # Get the image digest for the version-tagged image
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$VERSION_TAG \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "Image digest: $IMAGE_DIGEST"

          # Construct the specific image identifier using version tag
          IMAGE_IDENTIFIER="$ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG"

          echo "::notice::Updating App Runner to use specific image: $IMAGE_IDENTIFIER"

          # Update App Runner service to use the specific version tag
          # This replaces the :latest approach with deterministic version-based deployment
          echo "::notice::Updating App Runner service configuration to use $VERSION_TAG"
          
          UPDATE_RESULT=$(aws apprunner update-service \
            --service-arn $APPRUNNER_SERVICE_ARN \
            --source-configuration '{
              "ImageRepository": {
                "ImageIdentifier": "'$IMAGE_IDENTIFIER'",
                "ImageConfiguration": {
                  "Port": "3000"
                },
                "ImageRepositoryType": "ECR"
              },
              "AutoDeploymentsEnabled": false
            }' \
            --query 'OperationId' \
            --output text 2>&1)

          # Check if the update command failed
          if [ $? -ne 0 ]; then
            echo "::error::❌ Failed to update App Runner service"
            echo "::error::This typically means the service is busy with another operation"
            echo "::error::Error details: $UPDATE_RESULT"
            echo "::error::Please wait a few minutes and retry the deployment"
            exit 1
          fi

          echo "::notice::App Runner service update initiated with Operation ID: $UPDATE_RESULT"
          echo "::notice::App Runner will deploy: $IMAGE_IDENTIFIER"
          echo "::notice::Expected digest: $IMAGE_DIGEST"
          echo "operation_id=$UPDATE_RESULT" >> $GITHUB_OUTPUT
          echo "image_digest=$IMAGE_DIGEST" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Wait for App Runner Deployment
        env:
          APPRUNNER_SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
        run: |
          echo "::notice::Waiting for App Runner deployment to complete..."

          # Maximum wait time: 3 minutes (180 seconds) - fail fast approach
          MAX_WAIT=180
          ELAPSED=0
          INTERVAL=10

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            STATUS=$(aws apprunner describe-service \
              --service-arn $APPRUNNER_SERVICE_ARN \
              --query 'Service.Status' \
              --output text)

            echo "Current status: $STATUS (${ELAPSED}s elapsed)"

            if [ "$STATUS" = "RUNNING" ]; then
              echo "::notice::✅ App Runner service is now RUNNING"
              break
            elif [ "$STATUS" = "OPERATION_IN_PROGRESS" ]; then
              echo "Deployment in progress, waiting ${INTERVAL}s..."
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
            else
              echo "::error::❌ Unexpected status: $STATUS"
              echo "::error::App Runner deployment failed or service is in an error state"
              exit 1
            fi
          done

          if [ $ELAPSED -ge $MAX_WAIT ]; then
            echo "::error::❌ Deployment timed out after ${MAX_WAIT}s (3 minutes)"
            echo "::error::App Runner deployment is taking longer than expected"
            echo "::error::Check the App Runner service status manually or retry later"
            exit 1
          fi

      - name: Health Check
        env:
          APPRUNNER_SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
        run: |
          echo "::notice::Running health checks on deployed service..."

          # Get the service URL
          SERVICE_URL=$(aws apprunner describe-service \
            --service-arn $APPRUNNER_SERVICE_ARN \
            --query 'Service.ServiceUrl' \
            --output text)

          HEALTH_URL="https://$SERVICE_URL"

          echo "Testing URL: $HEALTH_URL"

          # Wait a bit for the service to fully start
          sleep 5

          # Try health check up to 3 times with shorter intervals - fail fast
          MAX_ATTEMPTS=3
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$HEALTH_URL" || echo "000")

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "::notice::✅ Health check passed! HTTP $HTTP_CODE"
              exit 0
            else
              echo "::warning::Health check returned HTTP $HTTP_CODE"

              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "Waiting 10s before retry..."
                sleep 10
              fi
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "::error::❌ Health checks failed after $MAX_ATTEMPTS attempts"
          echo "::error::Service may still be starting up - check manually: $HEALTH_URL"
          exit 1

      - name: Verify Deployment
        env:
          APPRUNNER_SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
          EXPECTED_DIGEST: ${{ steps.deploy-apprunner.outputs.image_digest }}
        run: |
          echo "::notice::Verifying deployment completed successfully..."

          # Wait for App Runner to fully update its configuration
          sleep 10

          # Get comprehensive service information
          SERVICE_STATUS=$(aws apprunner describe-service \
            --service-arn $APPRUNNER_SERVICE_ARN \
            --query 'Service.{Status:Status,Image:SourceConfiguration.ImageRepository.ImageIdentifier,UpdatedAt:UpdatedAt}' \
            --output json)

          CURRENT_STATUS=$(echo "$SERVICE_STATUS" | jq -r '.Status')
          CURRENT_IMAGE=$(echo "$SERVICE_STATUS" | jq -r '.Image')
          UPDATED_AT=$(echo "$SERVICE_STATUS" | jq -r '.UpdatedAt')

          echo "Service Status: $CURRENT_STATUS"
          echo "Current Image: $CURRENT_IMAGE"
          echo "Last Updated: $UPDATED_AT"
          echo "Expected Digest: $EXPECTED_DIGEST"

          # Check if service is running
          if [ "$CURRENT_STATUS" != "RUNNING" ]; then
            echo "::error::❌ Service is not in RUNNING state (current: $CURRENT_STATUS)"
            exit 1
          fi

          # Check if current image contains the expected digest
          if echo "$CURRENT_IMAGE" | grep -q "$EXPECTED_DIGEST"; then
            echo "::notice::✅ Deployment verified! Running correct image with digest."
            exit 0
          fi

          # If not using digest, check if it's the expected short SHA tag
          SHORT_SHA="${{ steps.deploy-apprunner.outputs.short_sha }}"
          if echo "$CURRENT_IMAGE" | grep -q "$SHORT_SHA"; then
            echo "::notice::✅ Deployment verified! Running correct image with tag $SHORT_SHA."
            exit 0
          fi

          # Check if using the expected version tag
          EXPECTED_VERSION_TAG="${{ steps.deploy-apprunner.outputs.version_tag }}"
          if echo "$CURRENT_IMAGE" | grep -q ":$EXPECTED_VERSION_TAG"; then
            echo "::notice::✅ Verified! App Runner is using the correct version tag: $EXPECTED_VERSION_TAG"
            exit 0
          fi

          # Check if using :latest tag (deprecated approach)
          if echo "$CURRENT_IMAGE" | grep -q ":latest"; then
            echo "::warning::⚠️  App Runner is still using :latest tag instead of specific version tag"
            echo "::warning::This suggests the service update may not have completed yet"

            # Verify the :latest tag in ECR has our expected digest
            LATEST_DIGEST=$(aws ecr describe-images \
              --repository-name wavelength-lore \
              --image-ids imageTag=latest \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null)

            if [ "$LATEST_DIGEST" = "$EXPECTED_DIGEST" ]; then
              echo "::notice::✅ At least the :latest tag points to our expected digest."
              echo "::notice::Deployment content is correct, but should use version tags going forward."
              exit 0
            else
              echo "::error::❌ The :latest tag points to a different image!"
              echo "::error::Expected: $EXPECTED_DIGEST"
              echo "::error::Got: $LATEST_DIGEST"
              exit 1
            fi
          fi

          # Complete mismatch - something is wrong
          echo "::error::❌ Deployment verification failed! Image mismatch."
          echo "::error::Expected: Image with digest $EXPECTED_DIGEST or tag $SHORT_SHA"
          echo "::error::Got: $CURRENT_IMAGE"
          exit 1

      - name: Invalidate CloudFront Cache (Optional)
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
            echo "::notice::CloudFront cache invalidated for distribution: $CLOUDFRONT_DISTRIBUTION_ID"
          else
            echo "::warning::CLOUDFRONT_DISTRIBUTION_ID not set, skipping cache invalidation"
          fi

      - name: Deployment Summary
        if: success()
        env:
          SHORT_SHA: ${{ steps.deploy-apprunner.outputs.short_sha }}
          VERSION_TAG: ${{ steps.deploy-apprunner.outputs.version_tag }}
        run: |
          echo "::notice::========================================="
          echo "::notice::🚀 Deployment Successful!"
          echo "::notice::========================================="
          echo "::notice::Version: $VERSION_TAG"
          echo "::notice::Commit: $SHORT_SHA"
          echo "::notice::Image Digest: ${{ steps.deploy-apprunner.outputs.image_digest }}"
          echo "::notice::Status: Running and healthy"
          echo "::notice::========================================="