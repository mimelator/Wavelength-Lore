# ⚠️  WORKFLOW DISABLED ⚠️
# 
# This GitHub Actions workflow has been DISABLED in favor of manual deployment control.
# 
# PREFERRED DEPLOYMENT METHOD:
#   npm run deploy          (uses scripts/manual-deploy.sh)
#   scripts/manual-deploy.sh
# 
# REASON FOR DISABLING:
#   Manual deployments provide better control, immediate feedback, and eliminate
#   CI/CD pipeline issues that were causing deployment inconsistencies.
#
# TO RE-ENABLE:
#   1. Change 'workflow_dispatch' back to 'push' trigger
#   2. Remove the DISABLED comments
#   3. Test thoroughly before relying on automated deployments
#
# LAST DISABLED: 2025-10-29

name: Build and Deploy to ECR (DISABLED)

# DISABLED: GitHub Actions deployment workflow
# Use npm run deploy or scripts/manual-deploy.sh for deployments instead
on:
  workflow_dispatch:  # Manual trigger only - workflow effectively disabled
  # DISABLED - Automatic deployment disabled in favor of manual control
  # push:
  #   branches:
  #     - main

jobs:
  build-and-push:
    name: Build and Push Docker Image to ECR (DISABLED)
    runs-on: ubuntu-latest
    # Workflow disabled - will not run on push events
    if: false  # Force disable entire job
    permissions:
      contents: write
      actions: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure Git
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Verify git remote configuration
          echo "::notice::Git remote origin: $(git remote get-url origin)"
          echo "::notice::Current branch: $(git branch --show-current)"
          echo "::notice::Git user: $(git config user.name) <$(git config user.email)>"

      - name: Check if Version Increment Needed
        id: check-version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Skip version increment if commit message contains [skip version]
          # Use environment variable to avoid shell escaping issues
          if echo "$COMMIT_MESSAGE" | grep -q "\[skip version\]"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Skipping version increment due to [skip version] in commit message"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "::notice::Version increment will be performed"
          fi

      - name: Increment Version
        id: increment-version
        if: steps.check-version.outputs.skip == 'false'
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

          # Increment patch version
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

          # Update version.json
          COMMIT_HASH="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_HASH:0:7}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > version.json << EOF
          {
            "version": "$NEW_VERSION",
            "buildDate": "$BUILD_DATE",
            "commitHash": "$COMMIT_HASH",
            "commitShort": "$COMMIT_SHORT",
            "buildNumber": "${{ github.run_number }}",
            "environment": "production",
            "workflowId": "${{ github.run_id }}",
            "deploymentStatus": "building"
          }
          EOF

          echo "::notice::Version incremented to $NEW_VERSION"

      - name: Set Version for Deployment
        id: set-version
        run: |
          if [ "${{ steps.check-version.outputs.skip }}" = "true" ]; then
            # Use existing version when skipping increment
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "::notice::Using existing version: $VERSION"
          else
            # Use newly incremented version
            VERSION="${{ steps.increment-version.outputs.new }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "::notice::Using incremented version: $VERSION"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Validate App Runner Service Health
        id: validate-apprunner
        env:
          APPRUNNER_SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
        run: |
          echo "🔍 WAVELENGTH: Validating App Runner service health before build..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Get current service status
          SERVICE_STATUS=$(aws apprunner describe-service \
            --service-arn "$APPRUNNER_SERVICE_ARN" \
            --query 'Service.Status' \
            --output text)
          
          SERVICE_URL=$(aws apprunner describe-service \
            --service-arn "$APPRUNNER_SERVICE_ARN" \
            --query 'Service.ServiceUrl' \
            --output text)
          
          CURRENT_IMAGE=$(aws apprunner describe-service \
            --service-arn "$APPRUNNER_SERVICE_ARN" \
            --query 'Service.SourceConfiguration.ImageRepository.ImageIdentifier' \
            --output text)
          
          echo "📊 SERVICE STATUS: $SERVICE_STATUS"
          echo "🌐 SERVICE URL: https://$SERVICE_URL"  
          echo "🐳 CURRENT IMAGE: $CURRENT_IMAGE"
          
          # 🚨 LOUD ROLLBACK DETECTION
          if echo "$CURRENT_IMAGE" | grep -q ":latest"; then
            echo ""
            echo "🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨"
            echo "🚨                    ROLLBACK DETECTED                      🚨"
            echo "🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨"
            echo ""
            echo "🎯 ISSUE: App Runner reverted to :latest tag instead of specific version"
            echo "📊 CURRENT IMAGE: $CURRENT_IMAGE"
            echo "⚠️  EXPECTED: Specific version tag (e.g., d7064e09, v1.0.177)"
            echo ""
            echo "🔍 POSSIBLE CAUSES:"
            echo "   • Health check failures on new image deployment"
            echo "   • Port configuration mismatch (should be 8080)"
            echo "   • Docker container startup issues"
            echo "   • App Runner automatic rollback after failed deployment"
            echo ""
            echo "🎯 CURRENT STRATEGY:"
            echo "   • Build new image with latest fixes"
            echo "   • Deploy with correct port configuration (8080)"
            echo "   • Monitor for successful deployment without rollback"
            echo ""
            
            # Skip auto-recovery to avoid deployment race conditions
            echo "🤖 SMART DECISION: Skipping auto-recovery to prevent deployment conflicts"
            echo "💡 STRATEGY: Build new image first, then let normal deployment update App Runner"
            echo "🎯 BENEFIT: Avoids race condition between auto-recovery deployment and new build deployment"
            
            # Log rollback detection for troubleshooting
            echo "::warning::⚠️  App Runner has reverted to :latest tag - likely due to recent rollback"
            echo "::notice::🔧 This build will create a new image and deploy it properly"
            echo "::notice::📊 Monitor App Runner operations for deployment success"
            
            # Optional: Check for recent rollbacks (if permissions allow)
            RECENT_ROLLBACKS=$(aws apprunner list-operations \
              --service-arn "$APPRUNNER_SERVICE_ARN" \
              --query 'length(OperationSummaryList[?Status==`ROLLBACK_SUCCEEDED` && StartedAt >= `2025-10-26`])' \
              --output text 2>/dev/null || echo "Permission denied - skipping rollback count")
            
            if [ "$RECENT_ROLLBACKS" != "Permission denied - skipping rollback count" ]; then
              echo "📊 RECENT ROLLBACKS: $RECENT_ROLLBACKS operations since today"
              if [ "$RECENT_ROLLBACKS" -gt "3" ]; then
                echo "::error::🔥 CRITICAL: High rollback count suggests persistent deployment issue"
                echo "::error::🔍 Manual investigation may be required after this deployment"
              fi
            else
              echo "📊 ROLLBACK COUNT: Unable to check (need apprunner:ListOperations permission)"
            fi
            
            echo ""
            echo "🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨🚨"
            echo ""
            
            # GitHub Actions annotations for visibility
            echo "::error::🚨 ROLLBACK DETECTED: App Runner using :latest instead of specific version"
            echo "::warning::📊 Current Image: $CURRENT_IMAGE"
            echo "::notice::🎯 Strategy: Build new image and deploy with correct configuration"
            
          else
            echo "✅ Service using specific version tag - no rollback detected"
            echo "🎯 CURRENT IMAGE: $CURRENT_IMAGE"
          fi
          
          # Check if service is in a healthy state for deployment
          case $SERVICE_STATUS in
            "RUNNING")
              echo "✅ Service is running - safe to deploy new image"
              ;;
            "CREATE_FAILED"|"DELETE_FAILED")
              echo "::error::❌ App Runner service is in failed state: $SERVICE_STATUS"
              echo "::error::Cannot deploy to failed service. Manual intervention required."
              exit 1
              ;;
            "OPERATION_IN_PROGRESS")
              echo "::warning::⚠️  Service has operation in progress: $SERVICE_STATUS"
              echo "::warning::Deployment may conflict with ongoing operation"
              echo "::notice::Continuing with build - GitHub Actions will handle deployment retries"
              ;;
            "PAUSED")
              echo "::warning::⚠️  Service is paused: $SERVICE_STATUS"
              echo "::notice::Service will resume when new deployment is triggered"
              ;;
            *)
              echo "::warning::⚠️  Unknown service status: $SERVICE_STATUS"
              echo "::notice::Proceeding with caution"
              ;;
          esac
          
          # Optional: Test current service health if running
          if [ "$SERVICE_STATUS" = "RUNNING" ]; then
            echo "🏥 Testing current service health..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$SERVICE_URL" || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Current service responding with HTTP 200"
            else
              echo "::warning::⚠️  Current service responding with HTTP $HTTP_STATUS"
              echo "::notice::New deployment may resolve health issues"
            fi
          fi
          
          echo "🎯 Pre-build validation complete - proceeding with image build"
          echo "service_status=$SERVICE_STATUS" >> $GITHUB_OUTPUT
          echo "current_image=$CURRENT_IMAGE" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Build and Push Docker Image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: wavelength-lore
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ steps.set-version.outputs.version }}
        run: |
          # Extract short commit SHA
          SHORT_SHA=${COMMIT_SHA:0:8}
          
          # Use the version determined in previous step (either incremented or existing)
          VERSION_TAG="v$VERSION"

          echo "🚀 WAVELENGTH: Starting Docker build process"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 NEW IMAGE TAGS: $VERSION_TAG and $SHORT_SHA" 
          echo "🐳 CURRENT DEPLOYED: ${{ steps.validate-apprunner.outputs.current_image }}"
          echo "📊 APP RUNNER STATUS: ${{ steps.validate-apprunner.outputs.service_status }}"
          echo "🎯 DEPLOYMENT STRATEGY: Specific version tags (no :latest dependency)"
          echo ""

          # Build with buildx and push with multiple tags
          # Using specific version tags only - App Runner configured to use specific versions
          # Use GitHub Actions cache instead of registry cache (more reliable)
          docker buildx build \
            --platform linux/amd64 \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            --progress=plain \
            .

          echo "::notice::Successfully pushed images with tags: $VERSION_TAG, $SHORT_SHA"
          echo "::notice::Commit SHA: $COMMIT_SHA"
          echo "::notice::Short SHA: $SHORT_SHA"
          echo "::notice::Version Tag: $VERSION_TAG"
          echo "::notice::Image: $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG"
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to App Runner
        id: deploy-apprunner
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: wavelength-lore
          COMMIT_SHA: ${{ github.sha }}
          APPRUNNER_SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
          VERSION_TAG: ${{ steps.build.outputs.version_tag }}
        run: |
          # Extract short commit SHA
          SHORT_SHA=${COMMIT_SHA:0:8}

          echo "::notice::Deploying commit $SHORT_SHA (version $VERSION_TAG) to App Runner"

          # 🎯 SIMPLE: Fail fast if deployment already in progress
          CURRENT_STATUS=$(aws apprunner describe-service \
            --service-arn $APPRUNNER_SERVICE_ARN \
            --query 'Service.Status' \
            --output text)

          echo "📊 Current App Runner status: $CURRENT_STATUS"

          if [ "$CURRENT_STATUS" = "RUNNING" ]; then
            echo "✅ Service ready for deployment"
          else
            echo "::error::❌ App Runner service is not ready: $CURRENT_STATUS"
            echo "::error::Current deployment/operation in progress - failing fast to avoid conflicts"
            echo "::error::Please retry when service returns to RUNNING state"
            echo "::notice::💡 This prevents deployment race conditions and ensures clean deployments"
            exit 1
          fi

          # Get the image digest for the version-tagged image
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$VERSION_TAG \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "Image digest: $IMAGE_DIGEST"

          # Construct the specific image identifier using version tag
          IMAGE_IDENTIFIER="$ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG"

          echo "::notice::Updating App Runner to use specific image: $IMAGE_IDENTIFIER"

          # Update App Runner service to use the specific version tag
          # This replaces the :latest approach with deterministic version-based deployment
          echo "::notice::Updating App Runner service configuration to use $VERSION_TAG"
          
          UPDATE_RESULT=$(aws apprunner update-service \
            --service-arn $APPRUNNER_SERVICE_ARN \
            --source-configuration '{
              "ImageRepository": {
                "ImageIdentifier": "'$IMAGE_IDENTIFIER'",
                "ImageConfiguration": {
                  "Port": "8080"
                },
                "ImageRepositoryType": "ECR"
              },
              "AutoDeploymentsEnabled": false
            }' \
            --query 'OperationId' \
            --output text 2>&1)

          # Check if the update command failed
          if [ $? -ne 0 ]; then
            echo "::error::❌ Failed to update App Runner service"
            echo "::error::This typically means the service is busy with another operation"
            echo "::error::Error details: $UPDATE_RESULT"
            echo "::error::Please wait a few minutes and retry the deployment"
            exit 1
          fi

          echo "::notice::App Runner service update initiated with Operation ID: $UPDATE_RESULT"
          echo "::notice::App Runner will deploy: $IMAGE_IDENTIFIER"
          echo "::notice::Expected digest: $IMAGE_DIGEST"
          echo "::notice::🎯 Deployment triggered - monitoring can be done separately"
          echo "operation_id=$UPDATE_RESULT" >> $GITHUB_OUTPUT
          echo "image_digest=$IMAGE_DIGEST" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Invalidate CloudFront Cache (Optional)
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
            echo "::notice::CloudFront cache invalidated for distribution: $CLOUDFRONT_DISTRIBUTION_ID"
          else
            echo "::warning::CLOUDFRONT_DISTRIBUTION_ID not set, skipping cache invalidation"
          fi

      - name: Commit Version Changes
        if: steps.deploy-apprunner.outcome == 'success' && steps.check-version.outputs.skip == 'false'
        continue-on-error: true
        env:
          NEW_VERSION: ${{ steps.set-version.outputs.version }}
        run: |
          echo "::notice::Committing version changes after successful deployment..."
          
          # Update version.json with successful deployment status
          COMMIT_HASH="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_HASH:0:7}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > version.json << EOF
          {
            "version": "$NEW_VERSION",
            "buildDate": "$BUILD_DATE",
            "commitHash": "$COMMIT_HASH",
            "commitShort": "$COMMIT_SHORT",
            "buildNumber": "${{ github.run_number }}",
            "environment": "production",
            "workflowId": "${{ github.run_id }}",
            "deploymentStatus": "deployed"
          }
          EOF

          # Check if there are any changes to commit
          if git diff --staged --quiet && git diff --quiet package.json version.json; then
            echo "::notice::No version changes to commit"
            exit 0
          fi

          # Commit the version changes
          git add package.json version.json
          git commit -m "🔖 Auto-increment version to v$NEW_VERSION after successful deployment [skip version]" || {
            echo "::notice::No changes to commit or commit failed"
            exit 0
          }

          # Ensure we have remote tags locally for existence check
          git fetch --tags origin || echo "::warning::Failed to fetch tags from origin (continuing)"

          # Create and push tag only if it doesn't already exist (idempotent)
          if git rev-parse -q --verify "refs/tags/v$NEW_VERSION" >/dev/null; then
            echo "::notice::Tag v$NEW_VERSION already exists on this repository; skipping tag creation"
          else
            git tag "v$NEW_VERSION" || {
              echo "::warning::Failed to create tag v$NEW_VERSION"
              exit 0
            }
            
            # Push tag with explicit error handling
            if git push origin "v$NEW_VERSION"; then
              echo "::notice::✅ Tag v$NEW_VERSION created and pushed"
            else
              echo "::warning::Failed to push tag v$NEW_VERSION - may already exist remotely"
            fi
          fi

          # Push the commit to main with better error handling
          if git push origin HEAD:main; then
            echo "::notice::✅ Version commit pushed successfully"
          else
            echo "::error::Failed to push version commit to main branch"
            echo "::error::This may be due to branch protection rules or concurrent pushes"
            echo "::notice::Deployment was successful, only version commit failed"
            # Don't fail the entire workflow for version commit issues
            exit 0
          fi

          echo "::notice::✅ Version commit/push step completed for v$NEW_VERSION"

      - name: Deployment Summary
        if: always() && steps.deploy-apprunner.outcome == 'success'
        env:
          SHORT_SHA: ${{ steps.deploy-apprunner.outputs.short_sha }}
          VERSION_TAG: ${{ steps.deploy-apprunner.outputs.version_tag }}
        run: |
          echo "::notice::========================================="
          echo "::notice::🚀 Deployment Successful!"
          echo "::notice::========================================="
          echo "::notice::Version: $VERSION_TAG"
          echo "::notice::Commit: $SHORT_SHA"
          echo "::notice::Image Digest: ${{ steps.deploy-apprunner.outputs.image_digest }}"
          echo "::notice::Status: Running and healthy"
          if [ "${{ steps.check-version.outputs.skip }}" = "false" ]; then
            echo "::notice::Version incremented and committed: v${{ steps.set-version.outputs.version }}"
          fi
          echo "::notice::========================================="
          
          # Show overall workflow status
          if [ "${{ job.status }}" != "success" ]; then
            echo "::warning::⚠️  Note: Deployment succeeded but some post-deployment steps may have failed"
            echo "::warning::This is typically the version commit step and does not affect the live deployment"
          fi