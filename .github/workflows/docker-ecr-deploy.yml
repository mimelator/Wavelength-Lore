name: Build and Deploy to ECR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Check if Version Increment Needed
        id: check-version
        run: |
          # Skip version increment if commit message contains [skip version]
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if echo "$COMMIT_MSG" | grep -q "\[skip version\]"; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::notice::Skipping version increment due to [skip version] in commit message"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "::notice::Version increment will be performed"
          fi

      - name: Increment Version
        id: increment-version
        if: steps.check-version.outputs.skip == 'false'
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "current=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT_VERSION"

          # Increment patch version
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

          # Update version.json
          COMMIT_HASH="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_HASH:0:7}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > version.json << EOF
          {
            "version": "$NEW_VERSION",
            "buildDate": "$BUILD_DATE",
            "commitHash": "$COMMIT_HASH",
            "commitShort": "$COMMIT_SHORT",
            "buildNumber": "${{ github.run_number }}",
            "environment": "production",
            "workflowId": "${{ github.run_id }}",
            "deploymentStatus": "building"
          }
          EOF

          echo "::notice::Version incremented to $NEW_VERSION"

      - name: Set Version for Deployment
        id: set-version
        run: |
          if [ "${{ steps.check-version.outputs.skip }}" = "true" ]; then
            # Use existing version when skipping increment
            VERSION=$(node -p "require('./package.json').version")
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "::notice::Using existing version: $VERSION"
          else
            # Use newly incremented version
            VERSION="${{ steps.increment-version.outputs.new }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "::notice::Using incremented version: $VERSION"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Validate App Runner Service Health
        id: validate-apprunner
        env:
          APPRUNNER_SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
        run: |
          echo "🔍 WAVELENGTH: Validating App Runner service health before build..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Get current service status
          SERVICE_STATUS=$(aws apprunner describe-service \
            --service-arn "$APPRUNNER_SERVICE_ARN" \
            --query 'Service.Status' \
            --output text)
          
          SERVICE_URL=$(aws apprunner describe-service \
            --service-arn "$APPRUNNER_SERVICE_ARN" \
            --query 'Service.ServiceUrl' \
            --output text)
          
          CURRENT_IMAGE=$(aws apprunner describe-service \
            --service-arn "$APPRUNNER_SERVICE_ARN" \
            --query 'Service.SourceConfiguration.ImageRepository.ImageIdentifier' \
            --output text)
          
          echo "📊 SERVICE STATUS: $SERVICE_STATUS"
          echo "🌐 SERVICE URL: https://$SERVICE_URL"  
          echo "🐳 CURRENT IMAGE: $CURRENT_IMAGE"
          
          # 🎯 ROLLBACK DETECTION & AUTO-RECOVERY
          if echo "$CURRENT_IMAGE" | grep -q ":latest"; then
            echo "🚨 ROLLBACK DETECTED: Service is using :latest tag instead of specific version"
            
            # Check recent rollback operations
            RECENT_ROLLBACKS=$(aws apprunner list-operations \
              --service-arn "$APPRUNNER_SERVICE_ARN" \
              --query 'length(OperationSummaryList[?Status==`ROLLBACK_SUCCEEDED` && StartedAt >= `2025-10-26`])' \
              --output text)
            
            echo "📊 RECENT ROLLBACKS: $RECENT_ROLLBACKS operations since today"
            
            if [ "$RECENT_ROLLBACKS" -gt "0" ]; then
              echo "🔧 AUTO-RECOVERY: Updating App Runner to use latest ECR image before building"
              
              # Get the most recent successful ECR image (not :latest)
              LATEST_ECR_IMAGE=$(aws ecr describe-images \
                --repository-name wavelength-lore \
                --query 'sort_by(imageDetails[?imageTags!=`null` && !contains(imageTags[0], `latest`)], &imagePushedAt)[-1].imageTags[0]' \
                --output text)
              
              if [ "$LATEST_ECR_IMAGE" != "None" ] && [ "$LATEST_ECR_IMAGE" != "" ]; then
                echo "🎯 RECOVERY TARGET: wavelength-lore:$LATEST_ECR_IMAGE"
                
                # Update App Runner to use the latest non-:latest image
                RECOVERY_RESULT=$(aws apprunner update-service \
                  --service-arn "$APPRUNNER_SERVICE_ARN" \
                  --source-configuration '{
                    "ImageRepository": {
                      "ImageIdentifier": "170023515523.dkr.ecr.us-east-1.amazonaws.com/wavelength-lore:'$LATEST_ECR_IMAGE'",
                      "ImageConfiguration": {
                        "Port": "8080"
                      },
                      "ImageRepositoryType": "ECR"
                    },
                    "AutoDeploymentsEnabled": false
                  }' \
                  --query 'OperationId' \
                  --output text 2>/dev/null)
                
                if [ $? -eq 0 ]; then
                  echo "✅ RECOVERY INITIATED: Operation $RECOVERY_RESULT"
                  echo "⏳ Waiting 30 seconds for recovery deployment to stabilize..."
                  sleep 30
                  
                  # Verify recovery
                  NEW_STATUS=$(aws apprunner describe-service \
                    --service-arn "$APPRUNNER_SERVICE_ARN" \
                    --query 'Service.Status' \
                    --output text)
                  echo "📊 RECOVERY STATUS: $NEW_STATUS"
                else
                  echo "::warning::⚠️  Auto-recovery failed, continuing with build anyway"
                fi
              else
                echo "::warning::⚠️  No suitable recovery image found, continuing with build"
              fi
            else
              echo "::notice::ℹ️  Using :latest tag but no recent rollbacks detected"
            fi
          else
            echo "✅ Service using specific version tag - no rollback detected"
          fi
          
          # Check if service is in a healthy state for deployment
          case $SERVICE_STATUS in
            "RUNNING")
              echo "✅ Service is running - safe to deploy new image"
              ;;
            "CREATE_FAILED"|"DELETE_FAILED")
              echo "::error::❌ App Runner service is in failed state: $SERVICE_STATUS"
              echo "::error::Cannot deploy to failed service. Manual intervention required."
              exit 1
              ;;
            "OPERATION_IN_PROGRESS")
              echo "::warning::⚠️  Service has operation in progress: $SERVICE_STATUS"
              echo "::warning::Deployment may conflict with ongoing operation"
              echo "::notice::Continuing with build - GitHub Actions will handle deployment retries"
              ;;
            "PAUSED")
              echo "::warning::⚠️  Service is paused: $SERVICE_STATUS"
              echo "::notice::Service will resume when new deployment is triggered"
              ;;
            *)
              echo "::warning::⚠️  Unknown service status: $SERVICE_STATUS"
              echo "::notice::Proceeding with caution"
              ;;
          esac
          
          # Optional: Test current service health if running
          if [ "$SERVICE_STATUS" = "RUNNING" ]; then
            echo "🏥 Testing current service health..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$SERVICE_URL" || echo "000")
            
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Current service responding with HTTP 200"
            else
              echo "::warning::⚠️  Current service responding with HTTP $HTTP_STATUS"
              echo "::notice::New deployment may resolve health issues"
            fi
          fi
          
          echo "🎯 Pre-build validation complete - proceeding with image build"
          echo "service_status=$SERVICE_STATUS" >> $GITHUB_OUTPUT
          echo "current_image=$CURRENT_IMAGE" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=host

      - name: Build and Push Docker Image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: wavelength-lore
          COMMIT_SHA: ${{ github.sha }}
          VERSION: ${{ steps.set-version.outputs.version }}
        run: |
          # Extract short commit SHA
          SHORT_SHA=${COMMIT_SHA:0:8}
          
          # Use the version determined in previous step (either incremented or existing)
          VERSION_TAG="v$VERSION"

          echo "🚀 WAVELENGTH: Starting Docker build process"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 NEW IMAGE TAGS: $VERSION_TAG and $SHORT_SHA" 
          echo "🐳 CURRENT DEPLOYED: ${{ steps.validate-apprunner.outputs.current_image }}"
          echo "📊 APP RUNNER STATUS: ${{ steps.validate-apprunner.outputs.service_status }}"
          echo "🎯 DEPLOYMENT STRATEGY: Specific version tags (no :latest dependency)"
          echo ""

          # Build with buildx and push with multiple tags
          # Using specific version tags only - App Runner configured to use specific versions
          # Use GitHub Actions cache instead of registry cache (more reliable)
          docker buildx build \
            --platform linux/amd64 \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG \
            --tag $ECR_REGISTRY/$ECR_REPOSITORY:$SHORT_SHA \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push \
            --progress=plain \
            .

          echo "::notice::Successfully pushed images with tags: $VERSION_TAG, $SHORT_SHA"
          echo "::notice::Commit SHA: $COMMIT_SHA"
          echo "::notice::Short SHA: $SHORT_SHA"
          echo "::notice::Version Tag: $VERSION_TAG"
          echo "::notice::Image: $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG"
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to App Runner
        id: deploy-apprunner
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: wavelength-lore
          COMMIT_SHA: ${{ github.sha }}
          APPRUNNER_SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
          VERSION_TAG: ${{ steps.build.outputs.version_tag }}
        run: |
          # Extract short commit SHA
          SHORT_SHA=${COMMIT_SHA:0:8}

          echo "::notice::Deploying commit $SHORT_SHA (version $VERSION_TAG) to App Runner"

          # Check App Runner service status first - fail fast if busy
          CURRENT_STATUS=$(aws apprunner describe-service \
            --service-arn $APPRUNNER_SERVICE_ARN \
            --query 'Service.Status' \
            --output text)

          echo "Current App Runner status: $CURRENT_STATUS"

          if [ "$CURRENT_STATUS" != "RUNNING" ]; then
            echo "::error::❌ App Runner service is not in RUNNING state (current: $CURRENT_STATUS)"
            echo "::error::This usually means another deployment is in progress or the service is recovering."
            echo "::error::Please wait for the service to return to RUNNING state and retry the deployment."
            echo "::error::You can check status with: aws apprunner describe-service --service-arn $APPRUNNER_SERVICE_ARN"
            exit 1
          fi

          # Get the image digest for the version-tagged image
          IMAGE_DIGEST=$(aws ecr describe-images \
            --repository-name $ECR_REPOSITORY \
            --image-ids imageTag=$VERSION_TAG \
            --query 'imageDetails[0].imageDigest' \
            --output text)

          echo "Image digest: $IMAGE_DIGEST"

          # Construct the specific image identifier using version tag
          IMAGE_IDENTIFIER="$ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG"

          echo "::notice::Updating App Runner to use specific image: $IMAGE_IDENTIFIER"

          # Update App Runner service to use the specific version tag
          # This replaces the :latest approach with deterministic version-based deployment
          echo "::notice::Updating App Runner service configuration to use $VERSION_TAG"
          
          UPDATE_RESULT=$(aws apprunner update-service \
            --service-arn $APPRUNNER_SERVICE_ARN \
            --source-configuration '{
              "ImageRepository": {
                "ImageIdentifier": "'$IMAGE_IDENTIFIER'",
                "ImageConfiguration": {
                  "Port": "8080"
                },
                "ImageRepositoryType": "ECR"
              },
              "AutoDeploymentsEnabled": false
            }' \
            --query 'OperationId' \
            --output text 2>&1)

          # Check if the update command failed
          if [ $? -ne 0 ]; then
            echo "::error::❌ Failed to update App Runner service"
            echo "::error::This typically means the service is busy with another operation"
            echo "::error::Error details: $UPDATE_RESULT"
            echo "::error::Please wait a few minutes and retry the deployment"
            exit 1
          fi

          echo "::notice::App Runner service update initiated with Operation ID: $UPDATE_RESULT"
          echo "::notice::App Runner will deploy: $IMAGE_IDENTIFIER"
          echo "::notice::Expected digest: $IMAGE_DIGEST"
          echo "operation_id=$UPDATE_RESULT" >> $GITHUB_OUTPUT
          echo "image_digest=$IMAGE_DIGEST" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT

      - name: Wait for App Runner Deployment
        env:
          APPRUNNER_SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
        run: |
          echo "::notice::Waiting for App Runner deployment to complete..."
          echo "::notice::No timeout - deployment will complete naturally"

          ELAPSED=0
          INTERVAL=15

          while true; do
            STATUS=$(aws apprunner describe-service \
              --service-arn $APPRUNNER_SERVICE_ARN \
              --query 'Service.Status' \
              --output text)
            
            echo "Current status: $STATUS (${ELAPSED}s elapsed)"
            
            if [ "$STATUS" = "RUNNING" ]; then
              echo "::notice::✅ App Runner service is now RUNNING"
              echo "::notice::🎉 Deployment completed successfully in ${ELAPSED}s"
              break
            elif [ "$STATUS" = "OPERATION_IN_PROGRESS" ]; then
              echo "Deployment in progress, waiting ${INTERVAL}s..."
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
            else
              echo "::error::❌ Unexpected status: $STATUS"
              echo "::error::App Runner deployment failed or service is in an error state"
              exit 1
            fi
          done

      - name: Health Check
        env:
          APPRUNNER_SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
        run: |
          echo "::notice::Running health checks on deployed service..."

          # Get the service URL
          SERVICE_URL=$(aws apprunner describe-service \
            --service-arn $APPRUNNER_SERVICE_ARN \
            --query 'Service.ServiceUrl' \
            --output text)

          HEALTH_URL="https://$SERVICE_URL"

          echo "Testing URL: $HEALTH_URL"

          # Wait a bit for the service to fully start
          sleep 5

          # Try health check up to 3 times with shorter intervals - fail fast
          MAX_ATTEMPTS=3
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$HEALTH_URL" || echo "000")

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ]; then
              echo "::notice::✅ Health check passed! HTTP $HTTP_CODE"
              exit 0
            else
              echo "::warning::Health check returned HTTP $HTTP_CODE"

              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "Waiting 10s before retry..."
                sleep 10
              fi
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "::error::❌ Health checks failed after $MAX_ATTEMPTS attempts"
          echo "::error::Service may still be starting up - check manually: $HEALTH_URL"
          exit 1

      - name: Enhanced Deployment Verification (WAVELENGTH)
        env:
          APPRUNNER_SERVICE_ARN: ${{ secrets.APPRUNNER_SERVICE_ARN }}
          EXPECTED_DIGEST: ${{ steps.deploy-apprunner.outputs.image_digest }}
        run: |
          echo "::notice::🌊 WAVELENGTH: Enhanced deployment verification with retry logic"
          
          # Retry deployment verification up to 3 times
          MAX_RETRIES=3
          RETRY_COUNT=0
          VERIFICATION_PASSED=false
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ] && [ "$VERIFICATION_PASSED" = false ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "::notice::Verification attempt $RETRY_COUNT/$MAX_RETRIES"
            
            # Wait for App Runner to sync (longer on first retry)
            if [ $RETRY_COUNT -eq 1 ]; then
              echo "::notice::Initial verification - waiting 15s for App Runner sync"
              sleep 15
            else
              echo "::notice::Retry $RETRY_COUNT - waiting 30s for App Runner sync"
              sleep 30
            fi
            
            # Get current service status
            SERVICE_INFO=$(aws apprunner describe-service \
              --service-arn $APPRUNNER_SERVICE_ARN \
              --query 'Service.{Status:Status,Image:SourceConfiguration.ImageRepository.ImageIdentifier,UpdatedAt:UpdatedAt}' \
              --output json)
            
            CURRENT_STATUS=$(echo "$SERVICE_INFO" | jq -r '.Status')
            CURRENT_IMAGE=$(echo "$SERVICE_INFO" | jq -r '.Image')
            
            echo "::notice::App Runner Status: $CURRENT_STATUS"
            echo "::notice::Current Image: $CURRENT_IMAGE"
            echo "::notice::Expected Digest: $EXPECTED_DIGEST"
            
            # Check if service is running
            if [ "$CURRENT_STATUS" != "RUNNING" ]; then
              echo "::warning::App Runner not in RUNNING state (attempt $RETRY_COUNT/$MAX_RETRIES)"
              continue
            fi
            
            # Check if image matches (digest or tag)
            if echo "$CURRENT_IMAGE" | grep -q "$EXPECTED_DIGEST"; then
              echo "::notice::✅ Perfect match: Image digest verified!"
              VERIFICATION_PASSED=true
            elif echo "$CURRENT_IMAGE" | grep -q ":latest"; then
              # Check if :latest points to our expected digest
              LATEST_DIGEST=$(aws ecr describe-images \
                --repository-name wavelength-lore \
                --image-ids imageTag=latest \
                --query 'imageDetails[0].imageDigest' \
                --output text 2>/dev/null || echo "unknown")
              
              if [ "$LATEST_DIGEST" = "$EXPECTED_DIGEST" ]; then
                echo "::notice::✅ Acceptable: :latest tag points to expected digest"
                VERIFICATION_PASSED=true
              else
                echo "::warning::App Runner using :latest but digest mismatch (attempt $RETRY_COUNT/$MAX_RETRIES)"
                echo "::warning::Latest digest: $LATEST_DIGEST vs Expected: $EXPECTED_DIGEST"
              fi
            else
              echo "::warning::Image mismatch (attempt $RETRY_COUNT/$MAX_RETRIES)"
            fi
          done
          
          # Final verification result
          if [ "$VERIFICATION_PASSED" = true ]; then
            echo "::notice::🎉 WAVELENGTH: Deployment verification successful!"
            echo "::notice::App Runner is using correct ECR image"
            exit 0
          else
            echo "::error::❌ WAVELENGTH: Deployment verification failed after $MAX_RETRIES attempts"
            echo "::error::App Runner may need manual intervention"
            echo "::error::This doesn't mean the ECR build failed - the image exists and is correct"
            exit 1
          fi
          fi

          # Check if current image contains the expected digest
          if echo "$CURRENT_IMAGE" | grep -q "$EXPECTED_DIGEST"; then
            echo "::notice::✅ Deployment verified! Running correct image with digest."
            exit 0
          fi

          # If not using digest, check if it's the expected short SHA tag
          SHORT_SHA="${{ steps.deploy-apprunner.outputs.short_sha }}"
          if echo "$CURRENT_IMAGE" | grep -q "$SHORT_SHA"; then
            echo "::notice::✅ Deployment verified! Running correct image with tag $SHORT_SHA."
            exit 0
          fi

          # Check if using the expected version tag
          EXPECTED_VERSION_TAG="${{ steps.deploy-apprunner.outputs.version_tag }}"
          if echo "$CURRENT_IMAGE" | grep -q ":$EXPECTED_VERSION_TAG"; then
            echo "::notice::✅ Verified! App Runner is using the correct version tag: $EXPECTED_VERSION_TAG"
            exit 0
          fi

          # Check if using :latest tag (deprecated approach)
          if echo "$CURRENT_IMAGE" | grep -q ":latest"; then
            echo "::warning::⚠️  App Runner is still using :latest tag instead of specific version tag"
            echo "::warning::This suggests the service update may not have completed yet"

            # Verify the :latest tag in ECR has our expected digest
            LATEST_DIGEST=$(aws ecr describe-images \
              --repository-name wavelength-lore \
              --image-ids imageTag=latest \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null)

            if [ "$LATEST_DIGEST" = "$EXPECTED_DIGEST" ]; then
              echo "::notice::✅ At least the :latest tag points to our expected digest."
              echo "::notice::Deployment content is correct, but should use version tags going forward."
              exit 0
            else
              echo "::error::❌ The :latest tag points to a different image!"
              echo "::error::Expected: $EXPECTED_DIGEST"
              echo "::error::Got: $LATEST_DIGEST"
              exit 1
            fi
          fi

          # Complete mismatch - something is wrong
          echo "::error::❌ Deployment verification failed! Image mismatch."
          echo "::error::Expected: Image with digest $EXPECTED_DIGEST or tag $SHORT_SHA"
          echo "::error::Got: $CURRENT_IMAGE"
          exit 1

      - name: Invalidate CloudFront Cache (Optional)
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
            echo "::notice::CloudFront cache invalidated for distribution: $CLOUDFRONT_DISTRIBUTION_ID"
          else
            echo "::warning::CLOUDFRONT_DISTRIBUTION_ID not set, skipping cache invalidation"
          fi

      - name: Commit Version Changes
        if: success() && steps.check-version.outputs.skip == 'false'
        env:
          NEW_VERSION: ${{ steps.set-version.outputs.version }}
        run: |
          echo "::notice::Committing version changes after successful deployment..."
          
          # Update version.json with successful deployment status
          COMMIT_HASH="${{ github.sha }}"
          COMMIT_SHORT="${COMMIT_HASH:0:7}"
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > version.json << EOF
          {
            "version": "$NEW_VERSION",
            "buildDate": "$BUILD_DATE",
            "commitHash": "$COMMIT_HASH",
            "commitShort": "$COMMIT_SHORT",
            "buildNumber": "${{ github.run_number }}",
            "environment": "production",
            "workflowId": "${{ github.run_id }}",
            "deploymentStatus": "deployed"
          }
          EOF

          # Commit the version changes
          git add package.json version.json
          git commit -m "🔖 Auto-increment version to v$NEW_VERSION after successful deployment [skip version]"
          
          # Create and push tag
          git tag "v$NEW_VERSION"
          git push origin main
          git push origin "v$NEW_VERSION"
          
          echo "::notice::✅ Version v$NEW_VERSION committed and tagged"

      - name: Deployment Summary
        if: success()
        env:
          SHORT_SHA: ${{ steps.deploy-apprunner.outputs.short_sha }}
          VERSION_TAG: ${{ steps.deploy-apprunner.outputs.version_tag }}
        run: |
          echo "::notice::========================================="
          echo "::notice::🚀 Deployment Successful!"
          echo "::notice::========================================="
          echo "::notice::Version: $VERSION_TAG"
          echo "::notice::Commit: $SHORT_SHA"
          echo "::notice::Image Digest: ${{ steps.deploy-apprunner.outputs.image_digest }}"
          echo "::notice::Status: Running and healthy"
          if [ "${{ steps.check-version.outputs.skip }}" = "false" ]; then
            echo "::notice::Version incremented and committed: v${{ steps.set-version.outputs.version }}"
          fi
          echo "::notice::========================================="