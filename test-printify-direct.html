<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Direct Printify API Call</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; }
        #log { background: #f8f9fa; padding: 15px; border: 1px solid #dee2e6; border-radius: 4px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🧪 Test Direct Printify API Call</h1>
    <p>This tests our new direct API call functionality (no unwanted preview dialog).</p>
    
    <div class="test-result info">
        <strong>Test Status:</strong> Ready to test
    </div>

    <button onclick="testDirectAPI()">🚀 Test Direct Printify API Call</button>
    <button onclick="clearLog()">🧹 Clear Log</button>

    <h3>📋 Test Log:</h3>
    <div id="log"></div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? '#dc3545' : type === 'success' ? '#28a745' : '#666';
            logDiv.innerHTML += `<div style="color: ${color};">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        async function testDirectAPI() {
            log('🧪 Starting Direct Printify API Test', 'info');
            
            try {
                // Test data similar to what the merchandise store would send
                const testPayload = {
                    imageId: 'test-image-1',
                    imageUrl: '/images/characters/wavelength-character-cosmic.webp',
                    imageTitle: 'Test Wavelength Character',
                    productType: 'validated-5', // t-shirt
                    blueprintId: 5,
                    printProviderId: 3,
                    imageContext: {
                        effects: { vibrancy: true },
                        borderEnabled: false,
                        borderColor: '#000000'
                    }
                };

                log('📤 Sending request to /api/merchandise/create-guided-product', 'info');
                log(`📋 Payload: ${JSON.stringify(testPayload, null, 2)}`, 'info');

                const response = await fetch('/api/merchandise/create-guided-product', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testPayload)
                });

                log(`📊 Response status: ${response.status} ${response.statusText}`, response.ok ? 'success' : 'error');

                if (!response.ok) {
                    const errorText = await response.text();
                    log(`❌ Error response: ${errorText}`, 'error');
                    return;
                }

                const result = await response.json();
                log('✅ API call successful!', 'success');
                log(`📦 Result: ${JSON.stringify(result, null, 2)}`, 'success');

                if (result.success && result.product) {
                    log('🎉 Product created successfully!', 'success');
                    log(`📝 Product ID: ${result.product.id}`, 'success');
                    log(`🏷️ Product Title: ${result.product.title}`, 'success');
                } else {
                    log('⚠️ API returned success=false', 'error');
                }

            } catch (error) {
                log(`💥 Test failed with error: ${error.message}`, 'error');
                console.error('Detailed error:', error);
            }
        }

        // Run test on page load
        document.addEventListener('DOMContentLoaded', () => {
            log('🌐 Test page loaded, ready for testing', 'info');
            log('💡 Click "Test Direct Printify API Call" to test our new functionality', 'info');
        });
    </script>
</body>
</html>
