    hidden: false
    enhanced_title: '"The Shire Sanctuary: Bastion of Hope Amidst Shadows" TAGLINE: "A sacred refuge, yet a target for darkness, where the line between healing and despair blurs." DESCRIPTION: Nestled in the heart of the Shire, the Shire Sanctuary stands as a beacon of tranquility, but its peace is threatened by the sinister forces lurking beyond its borders. Once a place where weary souls find solace, it now faces the specter of corruption, as the remnants of the Goblin King''s tyranny linger like shadows. The kind-hearted Shire Folk, guardians of this sanctuary, tirelessly tend to its vibrant flowers, but whispers of fear taint their songs. In the aftermath of the Battle for the Shire, Wavelength’s impromptu concerts strive to rekindle hope, yet every note played reverberates with the stakes of a world on the brink of chaos. CTA_HOOK: Will the Shire Sanctuary endure as a refuge against encroaching darkness, or will it fall victim to the lingering despair? Discover how this sanctuary''s fate intertwines with the Shire''s struggle for freedom! POWER_STATEMENT: The Shire Sanctuary possesses the power to heal both body and spirit, yet its vulnerability can unleash despair if overrun, turning hope into a weapon wielded by evil.'
  - id: the-shire
    title: The Shire
    type: place
    keywords:
      - shire
      - shire folk
      - homeland
    description: A quiet realm where peace is abundant, and nature thrives alongside the residents of the Shire who are known as The Shire Folk. The Shire is known for its rolling green hills, crystal-clear streams, and the famous Shire Sanctuary where Wavelength first performed their legendary concerts. The Shire Folk are deeply connected to nature, their fellow Shire Folk community and artisian crafts.  Often times, you will find Lucky, their resident Wise Elder, fishing in local streams.
    image: /images/seasons/season3/episodes/episode5/images/RebuildTheShire-08.webp
    image_gallery:
      - /images/seasons/season3/episodes/episode5/images/RebuildTheShire-12.webp
      - /images/seasons/season4/episodes/episode2/images/TheKingHasFled-15.webp
      - /images/seasons/season4/episodes/episode2/images/TheKingHasFled-10.webp
      - /images/seasons/season4/episodes/episode4/images/IceBlueGreed-18.webp
      - /images/seasons/season4/episodes/episode5/images/TheShireFortress-19.webp
    hidden: false
    enhanced_title: '"The Shire: Heart of Tranquility, Battleground of Shadows" TAGLINE: "A peaceful realm now teetering on the brink of darkness, threatened by the sinister forces of greed and despair." DESCRIPTION: The Shire, once a tranquil haven where nature flourished and harmony reigned among the Shire Folk, now stands as a battleground for survival. Its rolling green hills and crystal-clear streams are marred by the scars of corruption left by the Goblin King’s sinister influence. As the Goblins'' greed festers, the very essence of this idyllic land is at stake, and the Shire Folk must rally to reclaim their home from the clutches of tyranny. Here, amidst the whispers of nature, lies a sanctuary—once a stage for Wavelength''s legendary concerts—now a symbol of hope and resistance against encroaching darkness. Will they rise to defend their cherished homeland? CTA_HOOK: Are you ready to uncover the secrets that could save the Shire from its impending doom? POWER_STATEMENT: The Shire''s heart, when corrupted, can unleash a wave of despair that empowers the Goblin King, turning the land''s beauty into a weapon against its own people.'
band:
  - id: wavelength
    title: Wavelength
    type: band
    keywords:
      - wavelength
      - band
      - music group
      - heroes
      - family
    description: Wavelength is a mostly family band of musicians who use music to help them explore the natural world and culture. Wavelength gained their fame due to the Battle of the Shire that they personally experienced and retell in their music.  They are known for their love of music, adventure, and storytelling through song.
    image: /images/seasons/season4/episodes/episode8/images/shire-sanctuary-04.webp
    image_gallery:
      - /images/seasons/season4/episodes/episode8/images/shire-sanctuary-04.webp
      - /images/seasons/season4/episodes/episode7/images/burial-bonfire-at-the-shire-5.webp
