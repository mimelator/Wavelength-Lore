      - /images/seasons/season3/episodes/episode7/images/PrepareForBattle-01.webp
    hidden: false
    enhanced_title: '"The Ice Whales: Harbingers of Frozen Terror" TAGLINE: "These malevolent leviathans unleash chaos upon the seas, feeding on despair and destruction." DESCRIPTION: "In the treacherous depths of the far, frozen North, Ice Whales reign as the most feared creatures of the ocean. Unlike any ordinary whale, their ferocity knows no bounds; they thrive on chaos and will tear apart anything that crosses their path. With every hunt, the Shire Folk confront not just these monstrous beasts but also the darkness that threatens to consume their very souls. The stakes are high, for failing to conquer the Ice Whales could spell doom for their fragile community at the Ice Fortress." CTA_HOOK: "Will the Shire Folk rise to the challenge and harness the power of unity against these vile creatures, or will they succumb to the icy grip of despair?" POWER_STATEMENT: "By defeating an Ice Whale, one can gain the strength of the ocean''s fury, unlocking powers that can turn the tide in the battle against the Goblin King and his minions."'
