    hidden: false
    enhanced_title: '"The Ice Fortress: Bastion of Frozen Resolve" TAGLINE: "Within these glacial walls lies the power to either shield the innocent or unleash unspeakable terror." DESCRIPTION: The Ice Fortress stands as a towering sentinel of ice, a majestic yet haunting stronghold within the desolate frozen landscape. Home to the Frostborne, its denizens embody both warmth and welcome, offering sanctuary to all who seek refuge. Yet, this beauty masks a chilling truth—should the fortress fall into the wrong hands, its ice magic could become a weapon of unimaginable destruction, corrupting all it touches and plunging the realm into eternal winter. CTA_HOOK: Will the Ice Fortress become a sanctuary for healing, or will it succumb to darkness and chaos? Discover how its fate intertwines with the struggle against the Goblin King''s wicked ambitions! POWER_STATEMENT: The fortress grants control over the elemental forces of ice, capable of freezing entire armies in their tracks or unleashing blizzards that can obliterate landscapes, making it a powerful asset in the battle for the Shire.'
  - id: shire-sanctuary
    title: Shire Sanctuary
    type: place
    keywords:
      - shire sanctuary
      - sanctuary
      - healing place
      - concert venue
    description: A serene and peaceful sanctuary located in the heart of the Shire. The Shire Sanctuary is a place of healing and tranquility, where the weary can find rest and solace. Surrounded by lush greenery and vibrant flowers, it is tended by the kind-hearted Shire Folk who call this place home.  Occasionally Wavelength will perform impromptu concerts here to lift the spirits of the Shire Folk, as was the case after the Battle for the Shire.
    image: /images/seasons/season4/episodes/episode8/images/shire-sanctuary-05.webp
    image_gallery:
      - /images/seasons/season4/episodes/episode8/images/shire-sanctuary-04.webp
