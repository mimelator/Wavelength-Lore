band:
  - id: wavelength
    title: Wavelength
    type: band
    keywords:
      - wavelength
      - band
      - music group
      - heroes
      - family
    description: Wavelength is a mostly family band of musicians who use music to help them explore the natural world and culture. Wavelength gained their fame due to the Battle of the Shire that they personally experienced and retell in their music.  They are known for their love of music, adventure, and storytelling through song.
    image: /images/seasons/season4/episodes/episode8/images/shire-sanctuary-04.webp
