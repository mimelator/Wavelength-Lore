      - /images/seasons/season4/episodes/episode6/images/TheBattleOfTheShire-053.webp
      - /images/seasons/season4/episodes/episode6/images/TheBattleOfTheShire-068.webp
      - /images/seasons/season4/episodes/episode6/images/TheBattleOfTheShire-070.webp
      - /images/seasons/season4/episodes/episode6/images/TheBattleOfTheShire-047.webp
      - /images/seasons/season4/episodes/episode6/images/TheBattleOfTheShire-049.webp
      - /images/seasons/season4/episodes/episode6/images/TheBattleOfTheShire-064.webp
      - /images/seasons/season4/episodes/episode6/images/TheBattleOfTheShire-039.webp
      - /images/seasons/season2/episodes/episode2/images/Psychopath-13.webp
    hidden: false
    enhanced_title: '"The Goblin King: Harbinger of Desolation" TAGLINE: "A tyrant whose insatiable greed threatens to plunge the Shire into eternal darkness." DESCRIPTION: The Goblin King reigns supreme over his Misery of Goblins, a twisted horde that thrives on chaos and destruction. Guided by the ruthless decree of "Goblin''s Rule," he believes that dominance is the only law that matters. His relentless pursuit of power drives him to invade the Shire, igniting the fierce Battle of the Shire. As the stakes rise, the Goblin King''s malevolence corrupts all he touches, leaving a trail of despair and ruin in his wake. His greed blinds him to the clever traps set by Lucky, leading to a deadly confrontation that claims the life of the valiant Maurice, forever altering the fate of the Shire. CTA_HOOK: Will the Shire folk rise against this embodiment of evil, or will they fall victim to his dark ambition? POWER_STATEMENT: The Goblin King wields the destructive force of fear and manipulation, turning allies into enemies and igniting chaos wherever he treads.'
  - id: misery
    title: Misery of Goblins
    type: villain
    keywords:
      - misery
      - goblin horde
      - horde
      - army
    description: 'A Misery of Goblins is a goblin horde that is enthralled by the Goblin King to do his bidding.  They are driven by one thing: Greed.  Goblins are insatiably greedy and will do anything to get their hands on treasure, especially if it is shiny.  This makes them easy to manipulate, as Lucky discovered when he used an Ice Blue Diamond to lure the Goblin King out of hiding during the Battle for the Shire.'
    image: /images/seasons/season2/episodes/episode1/images/FallOfTheShire_take1-06.webp
    image_gallery:
      - /images/seasons/season2/episodes/episode4/images/MiseryOfGoblins-14.webp
      - /images/seasons/season2/episodes/episode4/images/MiseryOfGoblins-01.webp
