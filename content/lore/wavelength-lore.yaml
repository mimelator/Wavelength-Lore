      - https://df5sj8f594cdx.cloudfront.net/images/lores/daphne-flower/ai-generated-1760988441604-8c397d464dd02a6d.png
    enhanced_title: '"Daphne: The Enchantress of Fragrance" TAGLINE: "Beware the allure of the Daphne flower; its scent is a seductive veil hiding a perilous truth." DESCRIPTION: The Daphne flower, with its intoxicating aroma that dances between sweetness and spice, is not merely a botanical marvel—it is a potent instrument of enchantment. Legends whisper of its ability to ensnare the hearts and minds of those who inhale its fragrance, drawing them into a web of obsession. However, this captivating beauty masks a dark corruption that can twist the will of even the purest souls, leading them down a path of despair and chaos. CTA_HOOK: Are you ready to uncover the secrets of the Daphne flower and its role in the battle against darkness? POWER_STATEMENT: Those who harness the essence of Daphne can wield its enchanting power to manipulate emotions, but at a grave cost—each use drains their own spirit, binding them closer to the flower''s sinister will.'
villain:
  - id: goblin
    title: Goblins
    type: villain
    keywords:
      - goblin
      - villains
      - evil creatures
    description: 'A Goblin can be nearly anyone in disguise.  They often hate others without reason, and are only vaguely happy when they are spreading fear and hatred.  They live to rule, and their lust for power is insatiable.  Goblins can be thought of as a person who has been consumed by a Virus of Hatred, Fear and Greed.  Since Misery loves Company, Goblins often travel in groups called: Misery of Goblins, and they do their best to spread Misery wherever they go.'
    image: /images/seasons/season3/episodes/episode3/images/Sneak_Attack-16.webp
    image_gallery:
      - /images/seasons/season2/episodes/episode4/images/MiseryOfGoblins-14.webp
      - /images/seasons/season2/episodes/episode4/images/MiseryOfGoblins-01.webp
      - /images/seasons/season2/episodes/episode5/images/SlowTime-21.webp
      - /images/seasons/season2/episodes/episode6/images/Won_t_See_it_Coming-14.webp
      - /images/seasons/season3/episodes/episode3/images/Sneak_Attack-16.webp
      - /images/seasons/season3/episodes/episode3/images/Sneak_Attack-15.webp
      - /images/seasons/season3/episodes/episode6/images/WereComingForYou-15.webp
      - /images/seasons/season4/episodes/episode4/images/IceBlueGreed-27.webp
      - /images/seasons/season4/episodes/episode6/images/TheBattleOfTheShire-070.webp
      - /images/seasons/season4/episodes/episode6/images/TheBattleOfTheShire-064.webp
    hidden: false
    enhanced_title: '"Goblins: Agents of Chaos and Misery" TAGLINE: "Born from darkness, these creatures thrive on fear, spreading chaos wherever they roam." DESCRIPTION: Goblins are not merely creatures; they are the embodiment of malevolence, capable of donning any disguise to infiltrate the hearts of the unsuspecting. Fueled by an insatiable lust for power, they revel in sowing discord and despair. Each goblin is a puppet of the insidious Virus of Hatred, Fear, and Greed, transforming them into harbingers of ruin. As they swarm together in their dreaded Misery of Goblins, they seek to unleash a wave of corruption that threatens to engulf all that is good in the Shire. CTA_HOOK: How will the Shire Folk and Wavelength confront this relentless tide of darkness? Discover the epic struggles that unfold as they battle against the very essence of despair! POWER_STATEMENT: When united, Goblins wield a destructive force that can bend reality itself, infecting the very fabric of hope with their relentless greed and hatred.'
  - id: goblin-king
    title: Goblin King
    type: villain
    keywords:
      - goblin king
      - king
      - goblin ruler
      - psychopath
      - villain
    description: 'The Goblin King is a Psychopath that leads a Misery of Goblins to invade the Shire and begin the Battle of the Shire.  He lives by one Rule: Goblin''s Rule, which means that the only rule you ever need to know about when dealing with the Goblin King, is that he will Rule all over you.  He is tricked by Lucky and the fact that Goblin''s Greed is insatiable, into leaving his lair to pursue an Ice Blue Diamond, which Lucky uses to lure him out of hiding during the Battle for the Shire.  Maurice was killed by the Goblin King during this battle while defending the Shire.'
    image: /images/seasons/season4/episodes/episode3/images/GoblinsRule-17.webp
    image_gallery:
      - /images/seasons/season4/episodes/episode4/images/IceBlueGreed-18.webp
      - /images/seasons/season4/episodes/episode2/images/TheKingHasFled-23.webp
