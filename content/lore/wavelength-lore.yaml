nature:
  - id: daphne-flower
    title: 🌸 Daphne 🌸
    type: nature
    keywords:
      - sweet
      - floral
      - heady
      - intoxicating
      - spicy
      - fresh
      - clean
      - honey-like
      - lilac-like
      - hyancinth-like
      - citrus
      - daphne-flower
    description: The Daphne flower is renowned for its incredibly fragrant blossoms, which are often described as having a sweet, heady, and sometimes spicy scent. The intensity and specific nuances can vary slightly between species and even individual plants, but generally, you can expect a truly delightful aroma.  Some people say that it has peculiar properties that can captivate people like an enchantment spell.
    image: https://df5sj8f594cdx.cloudfront.net/images/lores/daphne-flower/ai-generated-1760986251316-43b560650f46c03e.png
    image_gallery:
      - https://df5sj8f594cdx.cloudfront.net/images/lores/daphne-flower/ai-generated-1760986251316-43b560650f46c03e.png
      - https://df5sj8f594cdx.cloudfront.net/images/lores/daphne-flower/ai-generated-1760986251319-384c2d94bb1cae10.png
      - https://df5sj8f594cdx.cloudfront.net/images/lores/daphne-flower/ai-generated-1760986190233-c12896907232363e.png
      - https://df5sj8f594cdx.cloudfront.net/images/lores/daphne-flower/ai-generated-1760989393439-30c00f45a891f6a6.png
      - https://df5sj8f594cdx.cloudfront.net/images/lores/daphne-flower/ai-generated-1760989393441-07b0d406748b6074.png
