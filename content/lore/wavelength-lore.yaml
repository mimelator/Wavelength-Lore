      - /images/seasons/season4/episodes/episode4/images/IceBlueGreed-18.webp
    hidden: false
    enhanced_title: 'The Relic of Infinite Greed TAGLINE: The jewel that awakens the darkest desires of the heart. DESCRIPTION: The Ice Blue Diamond, known as the Relic of Infinite Greed, is not merely a stunning gemstone; it is a beacon of corruption that calls to the greedy and power-hungry. Found only in the perilous lairs of Ice Dragons, its mesmerizing blue hue hides a sinister allure, capable of ensnaring even the noblest souls. As adventurers brave treacherous ice caves to claim this coveted treasure, they risk awakening its malevolent spirit. In the hands of the Goblin King, this diamond became a weapon of unimaginable power, fueling his insatiable lust for domination and chaos during the Battle for the Shire. CTA_HOOK: Will you resist the seductive call of the Ice Blue Diamond, or will you succumb to its corrupting influence? POWER_STATEMENT: Wielding this relic grants the bearer an insatiable hunger for power, twisting their very essence into a relentless force of greed and destruction.'
  - id: ice-dragons
    title: Ice Dragons
    type: thing
    keywords:
      - ice dragons
      - dragons
      - ice creatures
      - dragon lair
    description: Ice Dragons are majestic and powerful creatures that inhabit the frozen landscapes of the far North. With their shimmering scales and icy breath, they are both feared and revered by the inhabitants of the Ice Fortress. These dragons are known to be fiercely protective of their territory and will not hesitate to defend it against intruders.  Their lair is the only place where the rare and precious Ice Blue Diamonds can be found.
    image: /images/seasons/season3/episodes/episode7/images/PrepareForBattle-14.webp
    image_gallery:
      - /images/seasons/season3/episodes/episode1/images/IceFortress-04.webp
      - /images/seasons/season3/episodes/episode1/images/IceFortress-10.webp
      - /images/seasons/season3/episodes/episode1/images/IceFortress-11.webp
