  - id: goblin-king
    title: Goblin King
    type: villain
    keywords:
      - goblin king
      - king
      - goblin ruler
      - psychopath
      - villain
    description: 'The Goblin King is a Psychopath that leads a Misery of Goblins to invade the Shire and begin the Battle of the Shire.  He lives by one Rule: Goblin''s Rule, which means that the only rule you ever need to know about when dealing with the Goblin King, is that he will Rule all over you.  He is tricked by Lucky and the fact that Goblin''s Greed is insatiable, into leaving his lair to pursue an Ice Blue Diamond, which Lucky uses to lure him out of hiding during the Battle for the Shire.  Maurice was killed by the Goblin King during this battle while defending the Shire.'
    image: /images/seasons/season4/episodes/episode3/images/GoblinsRule-17.webp
