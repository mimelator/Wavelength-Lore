villain:
  - id: goblin
    title: Goblins
    type: villain
    keywords:
      - goblin
      - villains
      - evil creatures
    description: A Goblin can be nearly anyone in disguise.  They often hate others without reason, and leave only to spread fear and hatred.  They live to rule, and their lust for power is insatiable.  They are nothing more than a Virus in the form of person.  Since Misery loves Company, Goblins often travel in groups called a Misery of Goblins, spreading fear and terror wherever they go.
    image: /images/seasons/season3/episodes/episode3/images/Sneak_Attack-16.webp
