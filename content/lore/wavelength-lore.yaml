      - /images/seasons/season3/episodes/episode6/images/WereComingForYou-15.webp
      - /images/seasons/season4/episodes/episode4/images/IceBlueGreed-27.webp
      - /images/seasons/season4/episodes/episode6/images/TheBattleOfTheShire-070.webp
      - /images/seasons/season4/episodes/episode6/images/TheBattleOfTheShire-064.webp
    hidden: false
    enhanced_title: '"The Misery of Goblins: The Corrupted Horde of Greed" TAGLINE: "A relentless swarm, fueled by insatiable greed, bent on spreading darkness and despair across the Shire." DESCRIPTION: "The Misery of Goblins is no ordinary horde; it is a nightmarish legion enthralled by the Goblin King’s sinister will. These creatures, corrupted by an unquenchable thirst for treasure, are driven to wreak havoc and chaos wherever they tread. Their greed transforms them into mindless instruments of destruction, making them the perfect pawns in the Goblin King''s grand schemes. With every shiny trinket they seize, they plunge deeper into the abyss of avarice, leaving ruin in their wake." CTA_HOOK: "What fate awaits the Shire if this malevolent force is unleashed? Discover how the Shire Folk and Wavelength must confront this darkness!" POWER_STATEMENT: "The Misery of Goblins grants the Goblin King unparalleled control over the weak-willed, allowing him to unleash chaos and despair with a mere whisper, turning allies into enemies and hope into fear."'
thing:
  - id: ice-blue-diamond
    title: Ice Blue Diamond
    type: thing
    keywords:
      - ice blue diamond
      - diamond
      - gems
      - blue diamond
      - treasure
    description: Ice Blue Diamonds are rare and precious gemstones found only in the lairs of Ice Dragons. These diamonds are known for their stunning blue color and are highly sought after by collectors and adventurers alike. The process of mining these diamonds is extremely dangerous, as it involves navigating the treacherous ice caves guarded by the dragons.  Lucky used one of these diamonds to lure the Goblin King out of hiding during the Battle for the Shire.
    image: /images/seasons/season4/episodes/episode4/images/IceBlueGreed-27.webp
    image_gallery:
      - /images/seasons/season4/episodes/episode4/images/IceBlueGreed-23.webp
