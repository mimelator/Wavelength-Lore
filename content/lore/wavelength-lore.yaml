      - /images/seasons/season3/episodes/episode7/images/PrepareForBattle-15.webp
      - /images/seasons/season3/episodes/episode7/images/PrepareForBattle-14.webp
    hidden: false
    enhanced_title: '"Ice Dragons: Guardians of Frozen Fury" TAGLINE: "These titanic beasts wield the fury of winter, their icy breath a harbinger of doom for those who dare intrude." DESCRIPTION: "In the desolate expanse of the far North, Ice Dragons reign supreme, their majestic forms cloaked in shimmering scales of frost. Feared and revered by all, these formidable guardians protect their sacred lair—the only source of the coveted Ice Blue Diamonds. The stakes are high; to trespass upon their territory is to invite a wrath as chilling as the blizzards they command. Those who seek these precious gems must reckon with the terrifying consequence of awakening their icy fury." CTA_HOOK: "Dare you venture into the realm of the Ice Dragons? Discover how their power intertwines with the fate of the Shire and the battle against the Goblin King!" POWER_STATEMENT: "The Ice Dragons possess the ability to unleash devastating winter storms, freezing foes in their tracks and summoning blizzards that can obliterate entire armies."'
  - id: ice-whales
    title: Ice Whales
    type: thing
    keywords:
      - ice whales
      - whales
      - dangerous creatures
      - ocean beasts
    description: Ice Whales are the most dangerous evil creatures known to the deep oceans in the far, frozen North and are very different from more normally known types of whales found in the Oceans.  These ferocious creatures will rip you to shreds just for spite.  Some of the Shire Folk join the Denizens of the Ice Fortress to participate in the Ice Whale Hunt.
    image: /images/seasons/season3/episodes/episode2/images/Ice_Whale-17.webp
    image_gallery:
      - /images/seasons/season3/episodes/episode2/images/Ice_Whale-19.webp
