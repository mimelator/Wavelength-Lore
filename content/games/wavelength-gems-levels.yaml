    gemThemes:
      daphne: 🧭  # Compass (navigation & choices)
      jasper: 🧲  # Horseshoe (luck & protection) - from Level 1
      miles: ⚡   # Lightning bolt (energy & quick decisions)
      ivy: 🌈     # Rainbow (pot of gold) - from Level 1
      echo: 🍀    # Four-leaf clover (lucky) - from Level 1
    
    objectives:
      primary:
        type: score
        target: 3000
        description: Reach 3000 points
      secondary:
        - type: cascades
          target: 4
          description: Trigger 4 cascade combos
          reward:
            points: 400
            stars: 1
    
    constraints:
      moveLimit: 25
      gemTypes:
        - daphne
        - jasper
        - miles
        - ivy
        - echo
      gemTypeCount: 5
    
    narrative:
      briefing: Life is about choices! Embrace new experiences and take chances. Every move you make is a decision that shapes your journey!
      loreReference: season1/episode2
      characters:
        - Wavelength
      locations:
        - The Road
        - New Horizons
    
    progression:
      unlockRequirements:
        previousLevel: 1

