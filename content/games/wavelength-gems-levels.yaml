    episode: 2
    episodeKey: season1/episode2
    title: Jump Right In!
    description: Life is about choices, so make one and see what happens next! Match gems to embrace adventure and take action.
    difficulty: easy
    
    theme:
      primaryColor: "#3B82F6"        # Blue (adventure)
      secondaryColor: "#F59E0B"      # Amber (sunrise/new beginnings)
      accentColor: "#10B981"         # Green (action/go)
