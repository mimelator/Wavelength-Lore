    lyrics: >-
      I keep on looking for one thing That i can't buy on my own And if i can
      find it, I'm gonna bring it, (bring it) on home!  And so i keep searching 
      for that thing I can't buy on a shelf And you know, and you know that
      there must be someone I can reach out, (someone) I can call for help. 
      Keep on, Keep on Keep on looking for 1 2 Love Keep on, Keep on Keep on
      looking for 3 or 4 little words  Like I Love you Like I Love you Too!
    story: >-
      In the heartfelt episode "Keep On" from the "Prelude: Life in the Shire,"
      Wavelength explores the profound power of love and connection through the
      lens of perseverance. As the band faces the looming threat of the Goblin
      King, they reflect on the importance of relationships and the simple yet
      powerful words that express love. The narrative unfolds as they inspire
      each other to keep searching for meaning and hope amidst uncertainty,
      reminding listeners that true strength lies in their bonds. With an
      uplifting melody and poignant lyrics, "Keep On" resonates deeply,
      encouraging everyone to hold onto what truly matters as they navigate
      life's challenges. But even as Wavelength celebrates the power of love,
      dark clouds gather on the horizon—the Goblin King's army is mobilizing,
      and their next move will test whether love truly conquers all, or if some
      bonds are destined to be broken forever.
    title: Keep On
    youtubeLink: https://youtu.be/en9ir6dq7WQ
    original_story_summary: >-
      Wavelength focuses on the importance of relationships and the power of
      love and connection. The song emphasizes the significance of hearing and
      expressing love through simple yet meaningful words.
