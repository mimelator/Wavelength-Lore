    description: >-
      There are 3 or 4 little words that I enjoy hearing everyday… But as
      Wavelength searches for love and connection, they're unaware that the
      Goblin King's forces are already closing in, threatening to silence these
      precious words forever.
    hidden: false
    image: /images/seasons/season1/episodes/episode10/image.webp
    keywords:
