    story: >-
      In the gripping episode titled \"The King has Fled\" from the \"Battle of
      the Shire\" season, the Shire Folk rally their courage and resolve after a
      devastating conflict with the Goblin King. As they reclaim their beloved
      home, they discover that the Goblin King has escaped with the royal
      treasures and the Shire Royal Family—King, Queen, and Princess—still in
      his clutches. This harrowing twist ignites a fire in the hearts of the
      Shire Folk, who realize their fight is far from over. Determined to rescue
      their loved ones and restore peace, they prepare for an inevitable
      confrontation with the cunning Goblin King. With themes of resilience and
      unity, this episode sets the stage for an epic showdown that will redefine
      their lives forever!
    title: The King has Fled
    youtubeLink: https://youtu.be/SMqrc-2wdAA
    original_story_summary: >-
      The Goblin king being a coward at heart, fled the battle before it began,
      fleeing with his main GOblin Misery back to his swampy lair.  He took with
      him captives from the Shire, including the Royal Family.  Behind the
      GOblin King he left a token force to hold the Shire, so that the Shire
      Folk wouldn't pursue him.
    cliffhanger_hook: >-
      But when the Shire Folk finally believed they had driven the Goblin King
      away for good, a chilling howl echoed through the night, signaling his
      return with a darker force at his command. NEXT_EPISODE_TEASE: As shadows
      gather and alliances shift, the true battle for the Shire begins anew.
    next_episode_tease: >-
