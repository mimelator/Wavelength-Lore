    lyrics: >-
      Welcome to the Icy Fortress We've got room, and food to Spare When you're
      here you'll be protected under our care at the icy fortress!
    story: >-
      In \"Locked and Loaded,\" the Shire folk rise up with fierce determination
      to reclaim their homeland from the clutches of the nefarious Goblin King.
      After regrouping at the Ice Fortress, they prepare for an epic
      confrontation, fueled by hope and the unbreakable bond of community. As
      they rally together, armed with elven bows and magical arrows, they embody
      a spirit of defiance against tyranny, declaring that nothing will stop
      them from taking back their cherished homes. The episode culminates in a
      thrilling showdown, where the Shire folk confront their fears and emerge
      victorious, though they know the Goblin King may one day return.
      Experience the exhilarating power of unity and resilience in this
      electrifying chapter of the Wavelength saga!
    title: Locked And Loaded
    youtubeLink: https://youtu.be/9dUMX2KhR54
    original_story_summary: >-
      Wavelength and the Shire Folk escape the Goblin Invasion of the dear
      Shire, and flee to the far, frozen North.  There they find a place to
      recover and plan at the Ice Fortress. THe Ice Fortress is a safe haven for
      all, where everyone is welcome, no matter wealth or looks or race.
    cliffhanger_hook: >-
      But when the Shire folk finally gather their strength and march toward the
      horizon, a chilling howl echoes through the air—revealing that the Goblin
      King has summoned an ancient beast to thwart their plans.
      NEXT_EPISODE_TEASE: As the battle intensifies, alliances will be tested
      and secrets unveiled in the heart of the Shire.
    next_episode_tease: >-
      As the battle intensifies, alliances will be tested and secrets unveiled
      in the heart of the Shire.
    cta_tagline: Will courage be enough to reclaim home?
