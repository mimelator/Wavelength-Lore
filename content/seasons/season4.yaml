    story: >-
      In the thrilling episode \"Ice Blue Greed\" from the \"Battle of the
      Shire\" saga, the Shire folk band together in a desperate bid to reclaim
      their homeland from the clutches of the Goblin King. As they uncover the
      depths of the Goblin King's avarice, they set an ingenious trap, using a
      mesmerizing Ice Blue Diamond to lure him into a confrontation. Tensions
      rise as the Shire folk prepare for battle, fueled by their desire to rid
      their land of the corruption left behind by the goblins. With stakes
      higher than ever, Wavelength stands at the forefront, ready to fight for
      their home and the dreams that bind them together. Will their
      determination and clever strategy be enough to turn the tide in this epic
      showdown? Tune in to witness a tale of courage, unity, and the unyielding
      spirit of the Shire!
    title: Ice Blue Greed
    youtubeLink: https://youtu.be/LlhYGbc2xXM
    original_story_summary: >-
      The Shire FOlk know that the Goblin King is a coward, and that he won't
      openly attack a fortified shire without a good reason.  Lucky sets a trap
      for the Goblin King, using an irresistible Ice Blue Diamond as bait. The
      much coveted Ice Blue Diamonds can only be found in the far, frozen North
      as they are guarded by the fearsome Ice Dragons.
    cliffhanger_hook: >-
      But when Lucky's trap is finally sprung, an unexpected twist reveals that
      the Goblin King has anticipated their every move, and darkness looms over
      the Shire once more. NEXT_EPISODE_TEASE: As the battle escalates, secrets
      long buried will emerge, testing the bonds of the Shire folk and
      Wavelength like never before.
