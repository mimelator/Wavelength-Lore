    story: >-
      In the poignant episode \"Song of Mourning\" from the \"Battle of the
      Shire\" arc, Wavelength grapples with profound loss as they mourn their
      beloved drummer, Magical Maurice, who perished during the devastating
      battle against the Goblin King. Amidst their grief, they encounter Daphne,
      a talented young orphan and daughter of the Shire's Concert Master, who
      steps into the role of drummer, bringing both hope and tension to the
      band. As they navigate their sorrow and celebrate the resilience of the
      Shire Folk, Wavelength performs a heartfelt tribute in the form of the
      \"Song of Mourning,\" honoring those lost while reinforcing the importance
      of cherishing memories. This emotional journey not only strengthens their
      bond but also ignites a fierce determination to reclaim their home from
      the clutches of misery. Ultimately, Daphne’s arrival signals a new chapter
      for Wavelength, as they prepare to rise from their grief and fight for a
      brighter future in the Shire.
    title: Song of Mourning
    youtubeLink: https://youtu.be/JLSTXP3ipnQ
    original_story_summary: >-
      After the battle, the Shire Folk take time to mourn their losses and honor
      the memories of those who have passed. Wavelength didn't escape unscathed,
      as Wavelength's Drummer: Magical Maurice was lost in the battle.   Many
      others were killed, and many orphans were left behind.   One of the
      orphans is Daphne the daughter of the Shire's Concert Master, who was also
      killed in the battle along with her father. Daphne is left to take care of
      her younger brother, and as she is a prodigy on the drums, she takes up
      the mantle of Wavelength's drummer. Meanwhile, Eloquence, Wavelength's
      Bass player is devestated by the loss of Magical Maurice, who was his best
      friend.  He is not impressed with the idea of Daphne taking over as
      Wavelength's drummer, especially as Daphne seems to be such a bitter
      person. The Song of Mourning is a tribute to those who have passed, and a
      reminder to hold onto the memories of our loved ones.
