    story: >-
      In the gripping episode \"Goblin's Rule\" from the \"Battle of the Shire\"
      season, the Shire folk find themselves in the throes of despair as the
      Goblin King and his Misery of Goblins tighten their grip on their
      once-peaceful home. The Shire is a shadow of its former self, with the
      royal family abducted and the community living in fear under the Goblin
      King's tyrannical rule. However, hope emerges as a courageous blacksmith,
      a respected elder of the village, rises to unite the Shire folk in a bold
      rebellion. With determination and newfound strength, they prepare to
      confront their oppressor, aiming to reclaim their land and restore
      harmony. As the stakes reach an all-time high, the battle between light
      and darkness unfolds, revealing the true power of unity against
      corruption.
    title: Goblin's Rule
    youtubeLink: https://youtu.be/UcTy2Wf4kUg
    original_story_summary: >-
      There is only one motivation for a Goblin, and that is to rule over
      others.  This is the case for all Goblins, from the lowliest grunt to the
      Goblin King himself.  The Goblin King rules by lying, cheating, and
      stealing.  He has no honor, and no respect for others.  The only rule that
      the Goblin King has is that Goblins gonna rule all over you.
    cliffhanger_hook: >-
      But when the moon hung high, illuminating the Goblin King's sinister grin,
      a chilling whisper echoed through the Shire—a prophecy of doom that
      foretold the rise of an ancient force that even the Goblin King feared.
      NEXT_EPISODE_TEASE: As the Shire folk rally their courage, an unexpected
      ally emerges from the shadows, offering hope in the darkest of times.
    next_episode_tease: >-
      As the Shire folk rally their courage, an unexpected ally emerges from the
      shadows, offering hope in the darkest of times.
    cta_tagline: Will the Shire reclaim its lost dream?
