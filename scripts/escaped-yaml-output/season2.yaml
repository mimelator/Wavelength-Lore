    story: In the gripping episode \"Goblin King\" from the \"Fall of the Shire\" season, the Shire Folk find themselves in the throes of despair as the malevolent Goblin King and his Misery of Goblins lay siege to their beloved land. With their Royal Family abducted and the once-peaceful Shire turned into a realm of chaos, the resilient Shire Folk rally under the leadership of a revered blacksmith, determined to reclaim their home. As tensions escalate, Wavelength joins forces with the Shire to devise a daring plan to confront the Goblin King and break his grip on their lives. The climactic battle unfolds with heart-pounding stakes, culminating in a fierce showdown where courage, unity, and sacrifice intertwine. Ultimately, the Shire Folk emerge victorious, but not without loss, forever altering the fate of both the land and the band, as they strive to rebuild and restore their Shire Dream amidst the echoes of their harrowing journey.
    title: Goblin King
    youtubeLink: https://youtu.be/kGpLCx63Fh8
    original_story_summary: After the Goblin King found out about the insult at the Shire, he decided to invade with his Misery of Goblins. Wavelength didn't realize what was happening until it was too late. The Goblins took over the Shire and Wavelength was forced to perform a Concert for the Goblin King.
